<head>

<title>One Line</title>

<style>
/* Layout: one continuous cobalt line fills the right of a cool sheet; a quiet index on the left. */
:root {
  color-scheme: light;
  --sheet: #ECEFF2; --ink: #0E1116; --muted: #5B6470; --line: #2236F0; --rule: rgb(14 17 22 / .12);
  --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--sheet); color: var(--ink); font: 400 15px/1.55 var(--f-mono); overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.side { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(28px, 5vh, 56px) 0 clamp(24px, 4vh, 44px) clamp(24px, 4vw, 64px); min-height: 0; pointer-events: none; }
.side > * { pointer-events: auto; }
.who h1 { margin: 0; font: 400 34px/1 var(--f-serif); letter-spacing: -.01em; }
.who p { margin: 8px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .02em; }

.index { list-style: none; margin: 0; padding: 0; }
.index li { border-top: 1px solid var(--rule); }
.index li:last-child { border-bottom: 1px solid var(--rule); }
.index button { width: 100%; display: flex; align-items: baseline; gap: 14px; padding: 11px 0; text-align: left; }
.index .n { font-size: 11px; color: var(--muted); width: 18px; }
.index .t { font: 400 26px/1.05 var(--f-serif); transition: color .3s, transform .5s cubic-bezier(.2,.8,.2,1); }
.index li:not(.on) .t { color: rgb(14 17 22 / .38); }
.index button:hover .t { color: var(--ink); }
.index li.on .t { font-style: italic; transform: translateX(6px); }
.detail { overflow: hidden; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2,.8,.2,1); }
.index li.on .detail { grid-template-rows: 1fr; }
.detail > div { min-height: 0; padding: 0 0 0 32px; }
.detail p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; max-width: 34ch; }
.detail .meta { color: var(--muted); font-size: 11px; letter-spacing: .03em; margin-bottom: 6px; }
.detail a { display: inline-block; margin: 2px 14px 14px 0; font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); color: var(--line); }

.contact { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--muted); }
.contact .email { color: var(--ink); user-select: all; }
.contact button, .contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }

.fig { position: absolute; z-index: 2; right: clamp(20px, 3vw, 48px); bottom: clamp(20px, 4vh, 40px); text-align: right; font-size: 11px; color: var(--muted); pointer-events: none; }
.fig b { font-weight: 500; color: var(--ink); }
.hint { position: absolute; z-index: 2; right: clamp(20px, 3vw, 48px); top: clamp(28px, 5vh, 56px); font-size: 11px; color: var(--muted); }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  canvas { position: fixed; height: 58vh; height: 58svh; }
  .side { padding: 20px 20px 32px; min-height: 100svh; justify-content: flex-start; gap: 0; }
  .who { margin-bottom: calc(58svh - 72px); }
  .who h1 { font-size: 28px; }
  .index { background: var(--sheet); margin: 0 -20px; padding: 0 20px; }
  .index .t { font-size: 24px; }
  .contact { background: var(--sheet); margin: 0 -20px; padding: 18px 20px 8px; }
  .fig { position: fixed; top: calc(58svh - 30px); bottom: auto; right: 20px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .index .t, .detail { transition: none; } }
</style>
</head>
