<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lenticular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&family=Azeret+Mono:wght@400;500&display=swap">
<style>
/* Four lenticular postcards on a plain table. Moving the pointer (or tilting the phone) changes the viewing angle,
   and each card flips through process -> prototype -> the real thing. One caption below. */
:root {
  color-scheme: light;
  --table: #CFD3CC; --table-hi: #DCDFD8; --ink: #151816; --muted: #4C524D; --rule: rgb(21 24 22 / .18);
  --f-sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Azeret Mono", ui-monospace, Menlo, monospace;
  --cw: min(21vw, 300px, 44vh);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse 80% 70% at 50% 38%, var(--table-hi), var(--table) 72%); color: var(--ink); font: 400 15px/1.5 var(--f-sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
img { max-width: none; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.page { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(24px, 4.5vh, 44px) clamp(20px, 4vw, 64px) clamp(20px, 3.5vh, 36px); }
header h1 { margin: 0; font: 600 26px/1.1 var(--f-sans); letter-spacing: -.015em; }
header p { margin: 6px 0 0; font: 400 12px/1.5 var(--f-mono); color: var(--muted); }
.hint { position: absolute; right: clamp(20px, 4vw, 64px); top: clamp(30px, 5vh, 50px); margin: 0; font: 400 11px/1 var(--f-mono); color: var(--muted); }

.stage { align-self: center; justify-self: center; touch-action: none; padding: 28px 0 0; }
.row { display: flex; gap: clamp(20px, 2.4vw, 44px); list-style: none; margin: 0; padding: 0; perspective: 1100px; }
.row li { width: var(--cw); transform: translateY(var(--dy, 0)) rotate(var(--rot, 0deg)); }
.row li:nth-child(1) { --rot: -1.6deg; --dy: 6px; } .row li:nth-child(2) { --rot: .9deg; --dy: -10px; } .row li:nth-child(3) { --rot: -.5deg; --dy: 12px; } .row li:nth-child(4) { --rot: 1.8deg; --dy: -4px; }
.card { display: block; position: relative; width: 100%; aspect-ratio: var(--ar, 3 / 4); border-radius: 7px; text-decoration: none; transform-style: preserve-3d; will-change: transform; transition: box-shadow .3s; }
.card .body { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; background: #888;
  box-shadow: 0 0 0 1px rgb(0 0 0 / .08), 0 1px 1px rgb(0 0 0 / .12), 0 14px 24px -10px rgb(20 26 22 / .45), 0 36px 60px -30px rgb(20 26 22 / .5); }
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* the ridged plastic: fine vertical lenticules, plus a sheen that slides with the viewing angle */
.card .ridges { position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgb(255 255 255 / .10) 0 1px, rgb(255 255 255 / 0) 1px 2px, rgb(0 0 0 / .07) 2px 3px); mix-blend-mode: overlay; }
.card .sheen { position: absolute; inset: -10%; pointer-events: none; mix-blend-mode: soft-light;
  background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .55) 46%, rgb(255 255 255 / .0) 58%);
  transform: translateX(var(--sx, 0%)); }
.card .edge { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgb(255 255 255 / .28), inset 0 1px 0 rgb(255 255 255 / .45); }
.row li > span { display: flex; justify-content: space-between; margin-top: 14px; font: 400 11px/1.3 var(--f-mono); color: var(--muted); transition: color .2s; }
.row li > span b { font: 500 13px/1.3 var(--f-sans); color: var(--ink); opacity: .55; transition: opacity .2s; }
.row li.on > span b { opacity: 1; }
.row li.on > span { color: var(--ink); }

.caption { display: grid; grid-template-columns: auto 1fr; align-items: end; gap: 24px 48px; margin-top: 8px; }
.cap { max-width: 640px; transition: opacity .18s ease-in, transform .26s cubic-bezier(.2,.8,.2,1); }
.cap.out { opacity: 0; transform: translateY(6px); }
.cap h2 { margin: 0 0 6px; font: 600 clamp(28px, 3vw, 40px)/1 var(--f-sans); letter-spacing: -.025em; }
.cap .meta { margin: 0 0 8px; font: 400 12px/1.4 var(--f-mono); color: var(--muted); }
.cap p { margin: 0 0 10px; font-size: 15px; line-height: 1.5; max-width: 52ch; text-wrap: pretty; }
.cap a { font: 500 12px/1 var(--f-mono); text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.contact { justify-self: end; text-align: right; font: 400 12px/1.8 var(--f-mono); color: var(--muted); }
.contact .email { color: var(--ink); user-select: all; }
.contact button, .contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); margin-left: 10px; }
.contact .all { display: block; margin-top: 4px; }
.contact .all a { margin: 0; color: var(--muted); }

@media (max-width: 760px) {
  :root { --cw: calc((100vw - 32px - 14px) / 2); --ar: 4 / 5; }
  header .long { display: none; }
  .page { padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); grid-template-rows: auto auto 1fr auto; }
  header h1 { font-size: 24px; }
  header p { font-size: 11px; }
  .hint { top: calc(24px + env(safe-area-inset-top, 0px)); right: 16px; }
  .stage { padding-top: 18px; justify-self: stretch; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .row li { width: auto; }
  .row li > span { margin-top: 7px; font-size: 10px; }
  .row li > span b { font-size: 12px; }
  .caption { display: block; margin-top: 16px; align-self: start; }
  .cap h2 { font-size: 28px; }
  .cap p { font-size: 14px; line-height: 1.45; }
  .contact { text-align: left; justify-self: start; font-size: 11px; margin-top: 12px; }
  .contact .all { display: inline; margin: 0; }
  .contact .all a { margin-left: 8px; }
  .row li:nth-child(n) { --rot: 0deg; --dy: 0px; }
  .row li:nth-child(1) { --rot: -1deg; } .row li:nth-child(2) { --rot: .8deg; } .row li:nth-child(3) { --rot: .6deg; } .row li:nth-child(4) { --rot: -.9deg; }
  .contact .email ~ * { margin-left: 8px; }
}
@media (max-width: 760px) and (max-height: 760px) { .cap p { display: none; } }
@media (max-height: 700px) and (min-width: 761px) { .cap p { display: none; } }
@media (prefers-reduced-motion: reduce) { .cap { transition: none; } }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Hridae Walia</h1>
    <p>Product designer, San Francisco<span class="long"> · founding designer at Domis</span></p>
  </header>
  <p class="hint" id="hint" aria-hidden="true">move across the cards</p>
  <nav class="stage" id="stage" aria-label="Work">
    <ol class="row" id="row"></ol>
  </nav>
  <footer class="caption">
    <section class="cap" id="cap" aria-live="polite"></section>
    <div class="contact">
      <span class="email" id="email">hridaew@gmail.com</span><button id="copy" type="button">copy</button><a href="https://www.linkedin.com/in/hridae" target="_blank" rel="noopener">LinkedIn</a><a href="https://drive.google.com/file/d/1f11tgSCoo4GY0DuVhdmOVG17lPRpGb3Z/view?usp=sharing" target="_blank" rel="noopener">CV</a>
      <span class="all"><a href="../index.html">all sketches</a></span>
    </div>
  </footer>
</div>
<script>
(() => {
  const CARDS = [
    { t: "Domis", yr: "2024–now", href: "https://hridaew.com/domis", frames: ["domis-1", "domis-2", "domis-3"],
      meta: "Founding Product Designer · iOS + web",
      p: "An AI home app that learns your house from the smallest thing you'll give it: an address, a nameplate photo, an inspection report." },
    { t: "Virdio", yr: "2021–22", href: "https://hridaew.com/virdio", frames: ["virdio-1", "virdio-2", "virdio-3"],
      meta: "Product Designer · AR fitness",
      p: "Hardware-free AR fitness: an ordinary camera reads your body, and you calibrate by walking to virtual cones at the corners of your room." },
    { t: "OBSCURA", yr: "2025", href: "https://hridaew.com/obscura", frames: ["obscura-1", "obscura-2", "obscura-3"],
      meta: "Interaction design + Unity · MOHAI, Seattle",
      p: "300+ never-seen photographs from 1946 Japan, explored by one visitor's gaze in VR while an audience watches through their eyes. Sold out." },
    { t: "Memory Care", yr: "2020–23", href: "https://hridaew.com/memory-care", frames: ["mc-1", "mc-2", "mc-3"],
      meta: "Interaction Designer · SF Campus for Jewish Living",
      p: "Plush cats wired with pressure sensors and haptic motors for people living with dementia: pet one and it purrs. 98% positive across 200+ sessions." },
  ];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = matchMedia("(pointer: coarse)").matches;
  const row = document.getElementById("row"), stage = document.getElementById("stage"), cap = document.getElementById("cap");
  document.getElementById("hint").textContent = coarse ? "drag or tilt" : "move across the cards";

  const items = CARDS.map((c, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<a class="card" href="${c.href}" target="_blank" rel="noopener" aria-label="${c.t}, case study">
      <div class="body"><canvas></canvas><div class="ridges"></div><div class="sheen"></div><div class="edge"></div></div></a>
      <span><b>${c.t}</b>${c.yr}</span>`;
    row.appendChild(li);
    const card = li.querySelector(".card"), cv = li.querySelector("canvas");
    const imgs = c.frames.map((f) => { const im = new Image(); im.src = `media/${f}.webp`; im.decoding = "async"; im.onload = () => { it.dirty = true; }; return im; });
    const it = { li, card, cv, ctx: cv.getContext("2d"), imgs, sheen: li.querySelector(".sheen"), t: -1, dirty: true, cx: 0, w: 0, h: 0 };
    card.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") setActive(i); });
    card.addEventListener("focus", () => { setActive(i); eyeTarget = it.cx; });
    card.addEventListener("click", (e) => {
      // touch: first tap picks the card, a second tap opens it
      if (e.detail !== 0 && lastPointer !== "mouse" && active !== i) { e.preventDefault(); setActive(i); }
      if (dragMoved) e.preventDefault();
    });
    return it;
  });

  let active = -1;
  function setActive(i) {
    if (i === active) return;
    const first = active === -1; active = i;
    items.forEach((it, j) => it.li.classList.toggle("on", j === i));
    const c = CARDS[i];
    const html = `<h2>${c.t}</h2><p class="meta">${c.meta} · ${c.yr}</p><p>${c.p}</p><a href="${c.href}" target="_blank" rel="noopener">Case study ↗</a>`;
    if (first || reduce) { cap.innerHTML = html; return; }
    cap.classList.add("out");
    clearTimeout(setActive.tm); setActive.tm = setTimeout(() => { cap.innerHTML = html; cap.classList.remove("out"); }, 150);
  }

  function layout() {
    const dpr = Math.min(2, devicePixelRatio || 1);
    items.forEach((it) => {
      const r = it.card.getBoundingClientRect();
      it.cx = r.left + r.width / 2; it.cy = r.top + r.height / 2;
      const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
      if (w !== it.cv.width || h !== it.cv.height) { it.cv.width = w; it.cv.height = h; }
      it.w = w; it.h = h; it.dpr = dpr; it.dirty = true;
    });
    span = Math.max(260, innerWidth * 0.32);
  }

  // Draw one lenticular state. t in [0, n-1]; the angle varies slightly across the card, so mid-flip shows the
  // characteristic banded wipe where neighbouring lenticules land on different frames.
  function draw(it, t) {
    const { ctx, w, h, imgs, dpr } = it, n = imgs.length;
    const lw = Math.max(2, Math.round(3 * dpr)); // one lenticule ≈ 3 CSS px
    const strips = Math.ceil(w / lw);
    ctx.fillStyle = "#8a8f8a"; ctx.fillRect(0, 0, w, h);
    for (let s = 0; s < strips; s++) {
      const u = (s + 0.5) / strips;
      const lt = Math.max(0, Math.min(n - 1, t + (u - 0.5) * 0.3));
      const k = Math.floor(lt), f = lt - k;
      const blend = f < 0.4 ? 0 : f > 0.6 ? 1 : (f - 0.4) / 0.2; // ghosting only in a narrow band near the flip
      const x = s * lw, sw = Math.min(lw, w - x);
      drawStrip(ctx, imgs[k], x, sw, w, h, 1);
      if (blend > 0 && k + 1 < n) drawStrip(ctx, imgs[k + 1], x, sw, w, h, blend);
    }
    ctx.globalAlpha = 1;
  }
  function drawStrip(ctx, im, x, sw, w, h, a) {
    if (!im.complete || !im.naturalWidth) return;
    // cover-fit the frame into the card, then take this lenticule's slice of it
    const iw = im.naturalWidth, ih = im.naturalHeight, sc = Math.max(w / iw, h / ih);
    const vw = w / sc, vh = h / sc, ox = (iw - vw) / 2, oy = (ih - vh) / 2;
    ctx.globalAlpha = a;
    ctx.drawImage(im, ox + (x / w) * vw, oy, (sw / w) * vw, vh, x, 0, sw, h);
  }

  /* viewing position: mouse x, touch drag, or device tilt */
  let eye = innerWidth * 0.62, eyeTarget = eye, span = 400, lastPointer = "mouse", dragMoved = false;
  let dragging = false, dx0 = 0, eye0 = 0, tiltOn = false;
  addEventListener("pointermove", (e) => {
    lastPointer = e.pointerType;
    if (e.pointerType === "mouse") { eyeTarget = e.clientX; const h = hitCard(e.clientX, e.clientY); if (h >= 0) setActive(h); }
    else if (dragging) { const d = e.clientX - dx0; if (Math.abs(d) > 6) dragMoved = true; eyeTarget = eye0 + d * 2.2; }
  });
  stage.addEventListener("pointerdown", (e) => {
    lastPointer = e.pointerType; dragMoved = false;
    if (e.pointerType !== "mouse") { dragging = true; dx0 = e.clientX; eye0 = eyeTarget; askTilt(); }
  });
  addEventListener("pointerup", () => { dragging = false; });
  addEventListener("pointercancel", () => { dragging = false; });
  function hitCard(x, y) {
    for (let i = 0; i < items.length; i++) { const r = items[i].card.getBoundingClientRect(); if (x >= r.left - 20 && x <= r.right + 20 && y >= r.top - 40 && y <= r.bottom + 60) return i; }
    return -1;
  }
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { e.preventDefault(); eyeTarget += span * 0.4; }
    if (e.key === "ArrowLeft") { e.preventDefault(); eyeTarget -= span * 0.4; }
  });
  function onTilt(e) {
    if (e.gamma == null) return;
    tiltOn = true;
    eyeTarget = innerWidth / 2 + Math.max(-30, Math.min(30, e.gamma)) / 30 * innerWidth * 0.9;
  }
  let asked = false;
  function askTilt() {
    if (asked) return; asked = true;
    const DOE = window.DeviceOrientationEvent;
    if (DOE && typeof DOE.requestPermission === "function") {
      DOE.requestPermission().then((s) => { if (s === "granted") addEventListener("deviceorientation", onTilt); }).catch(() => {});
    }
  }
  if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== "function") addEventListener("deviceorientation", onTilt);

  // images hold steady over a range of angles and flip in a short band, like real lenticular print
  function tAt(x, it) {
    const raw = Math.max(0, Math.min(2, 1 + ((x - it.cx) / span) * 1.25));
    const k = Math.min(1, Math.floor(raw)), f = raw - k;
    const g = f < 0.3 ? 0 : f > 0.7 ? 1 : (f - 0.3) / 0.4;
    return k + g * g * (3 - 2 * g);
  }
  // a resting viewpoint where every card sits on a clean frame and the row shows as many different frames as possible
  function restEye() {
    let best = innerWidth / 2, bestScore = -1e9;
    for (let x = innerWidth * 0.2; x <= innerWidth * 0.8; x += 2) {
      const ts = items.map((it) => tAt(x, it));
      const clean = ts.reduce((a, t) => a + (Math.abs(t - Math.round(t)) < 0.02 ? 1 : -2), 0);
      const distinct = new Set(ts.map((t) => Math.round(t))).size;
      const score = clean * 10 + distinct * 6 - Math.abs(x - innerWidth / 2) / innerWidth;
      if (score > bestScore) { bestScore = score; best = x; }
    }
    return best;
  }

  /* render loop */
  let raf = 0, last = performance.now();
  function frame(now) {
    raf = 0;
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const lo = -innerWidth * 0.6, hi = innerWidth * 1.6;
    eyeTarget = Math.max(lo, Math.min(hi, eyeTarget));
    eye += (eyeTarget - eye) * (reduce ? 1 : 1 - Math.exp(-dt * 14));
    let moving = Math.abs(eyeTarget - eye) > 0.3;
    items.forEach((it) => {
      const rel = (eye - it.cx) / span;            // -1 .. 1 across ±span
      const t = tAt(eye, it);
      const q = reduce ? Math.round(t) : t;
      if (it.dirty || Math.abs(q - it.t) > 0.004) { draw(it, q); it.t = q; it.dirty = false; }
      const ang = Math.max(-1, Math.min(1, rel));
      it.card.style.transform = reduce ? "" : `rotateY(${(ang * 7).toFixed(2)}deg)`;
      it.sheen.style.setProperty("--sx", `${(-ang * 38).toFixed(1)}%`);
    });
    if (moving || items.some((it) => it.dirty)) schedule();
  }
  function schedule() { if (!raf && !document.hidden) raf = requestAnimationFrame(frame); }
  ["pointermove", "keydown", "deviceorientation", "pointerdown"].forEach((ev) => addEventListener(ev, schedule));
  items.forEach((it) => it.imgs.forEach((im) => im.addEventListener("load", schedule)));
  document.addEventListener("visibilitychange", schedule);
  addEventListener("resize", () => { layout(); if (!touched) eyeTarget = restEye(); schedule(); });

  document.getElementById("copy").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText("hridaew@gmail.com"); b.textContent = "copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected"; }
    setTimeout(() => (b.textContent = "copy"), 1500);
  });

  setActive(0);
  layout();
  eye = eyeTarget = restEye();
  if (!reduce) {
    // an opening glance: the eye sweeps in from the right so every card flips once
    eye = innerWidth * 1.25;
  }
  document.fonts && document.fonts.ready.then(() => { layout(); if (!touched) eyeTarget = restEye(); schedule(); });
  let touched = false; ["pointerdown", "pointermove", "keydown"].forEach((ev) => addEventListener(ev, () => { touched = true; }, { once: true }));
  schedule();
})();
</script>
</body>
</html>
