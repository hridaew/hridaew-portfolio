<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exploded View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Azeret+Mono:wght@400;500;600&display=swap">
<style>
/* An isometric exploded view of how I work: five layers, leader lines out to real projects, one slider to assemble. */
:root {
  color-scheme: light;
  --paper: #F3F4F0; --ink: #121417; --muted: #5A5F63; --thin: rgb(18 20 23 / .28); --hair: rgb(18 20 23 / .12);
  --edge-a: #DADDD5; --edge-b: #C6CAC1; --hot: #E5481B;
  --f-head: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "Azeret Mono", ui-monospace, Menlo, Consolas, monospace;
  --S: min(265px, 19vw, 29vh); --T: 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--hair) 1px, transparent 1px), linear-gradient(90deg, var(--hair) 1px, transparent 1px);
  background-size: 48px 48px; background-position: -1px -1px;
  color: var(--ink); font: 400 12px/1.5 var(--f-mono); overflow: hidden; -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(ellipse 70% 70% at 40% 50%, rgb(243 244 240 / .55), var(--paper) 85%); pointer-events: none; }
img { max-width: none; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }

/* drawing frame with zone marks */
.frame { position: fixed; inset: 14px; border: 1.5px solid var(--ink); pointer-events: none; z-index: 1; }
.frame::before { content: ""; position: absolute; inset: 6px; border: .75px solid var(--thin); }
.zone { position: absolute; font: 500 9px/1 var(--f-mono); color: var(--muted); }

.app { position: relative; z-index: 2; height: 100%; }
.who { position: absolute; left: 44px; top: 40px; }
.who h1 { margin: 0; font: 800 clamp(34px, 3.4vw, 50px)/.9 var(--f-head); font-stretch: 68%; letter-spacing: .005em; text-transform: uppercase; }
.who p { margin: 10px 0 0; font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.who p b { color: var(--ink); font-weight: 500; }
.back { position: absolute; right: 44px; top: 36px; font-size: 11px; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--thin); }

/* the stack */
.stage { position: absolute; left: 0; top: 0; width: 56%; height: 100%; touch-action: none; cursor: ns-resize; }
.lift { position: absolute; left: 50%; top: 54%; width: 0; height: 0; }
.iso { position: absolute; left: calc(var(--S) / -2); top: calc(var(--S) / -2); width: var(--S); height: var(--S); transform-style: preserve-3d; transform: rotateX(58deg) rotateZ(-45deg); }
.plate, .pull { position: absolute; inset: 0; transform-style: preserve-3d; }
.plate .top { position: absolute; inset: 0; background: #FBFBF9; border: 1.5px solid var(--ink); padding: 7%; backface-visibility: hidden; transition: border-color .2s; }
.plate .top img { width: 100%; height: 100%; object-fit: cover; border: .75px solid var(--ink); transition: filter .25s; }
.plate .top::after { content: ""; position: absolute; left: 3.5%; top: 3.5%; width: 3px; height: 3px; border-radius: 50%; background: var(--ink); box-shadow: calc(var(--S) * .93 - 3px) 0 var(--ink), 0 calc(var(--S) * .93 - 3px) var(--ink), calc(var(--S) * .93 - 3px) calc(var(--S) * .93 - 3px) var(--ink); }
.plate .f { position: absolute; background: var(--edge-a); border: 1.5px solid var(--ink); backface-visibility: hidden; }
.plate .fb { left: 0; top: 100%; width: 100%; height: var(--T); transform-origin: top; transform: rotateX(-90deg); }
.plate .ft { left: 0; bottom: 100%; width: 100%; height: var(--T); transform-origin: bottom; transform: rotateX(90deg); }
.plate .fr { top: 0; left: 100%; width: var(--T); height: 100%; transform-origin: left; transform: rotateY(90deg); background: var(--edge-b); }
.plate .fl { top: 0; right: 100%; width: var(--T); height: 100%; transform-origin: right; transform: rotateY(-90deg); background: var(--edge-b); }
.plate .anc { position: absolute; width: 1px; height: 1px; }
.plate.on .top { border-color: var(--hot); }
.dim .plate:not(.on) .top img { filter: grayscale(1) contrast(.9) brightness(1.08); }

svg.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
svg.leaders path { fill: none; stroke: var(--ink); stroke-width: .9; }
svg.leaders path.axis { stroke: var(--thin); stroke-dasharray: 10 4 2 4; }
svg.leaders circle { fill: var(--ink); }
svg.leaders .on path { stroke: var(--hot); stroke-width: 1.4; }
svg.leaders .on circle { fill: var(--hot); }

/* callouts */
.calls { position: absolute; left: 58%; top: 0; width: min(390px, 30vw); list-style: none; margin: 0; padding: 0; }
.call { position: absolute; left: 0; width: 100%; display: grid; grid-template-columns: 30px 1fr; column-gap: 12px; transform: translateY(-14px); }
.balloon { width: 28px; height: 28px; border: 1.5px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--f-mono); background: var(--paper); transition: background .2s, color .2s, border-color .2s; }
.call.on .balloon { background: var(--hot); border-color: var(--hot); color: #fff; }
.call h2 { margin: 6px 0 4px; font: 700 15px/1 var(--f-head); font-stretch: 80%; letter-spacing: .06em; text-transform: uppercase; }
.call p { margin: 0 0 5px; font-size: 12px; line-height: 1.5; color: #2b2f33; max-width: 40ch; }
.call a { font-size: 11px; font-weight: 500; text-decoration: none; border-bottom: 1px solid var(--ink); margin-right: 14px; white-space: nowrap; }
.call a:hover { color: var(--hot); border-color: var(--hot); }

/* slider */
.assy { position: absolute; left: 44px; bottom: 40px; display: grid; gap: 8px; width: min(300px, 30vw); }
.assy label { display: flex; justify-content: space-between; font: 500 10px/1 var(--f-mono); letter-spacing: .1em; color: var(--muted); }
.assy input { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; cursor: pointer; touch-action: pan-y; }
.assy input::-webkit-slider-runnable-track { height: 22px; background: linear-gradient(var(--ink), var(--ink)) 0 50% / 100% 1.5px no-repeat, repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 10%) 0 50% / 100% 9px no-repeat; }
.assy input::-moz-range-track { height: 22px; background: linear-gradient(var(--ink), var(--ink)) 0 50% / 100% 1.5px no-repeat, repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px 10%) 0 50% / 100% 9px no-repeat; }
.assy input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 22px; background: var(--hot); border: 0; clip-path: polygon(50% 100%, 0 30%, 0 0, 100% 0, 100% 30%); transition: transform .15s; }
.assy input::-moz-range-thumb { width: 14px; height: 22px; background: var(--hot); border: 0; border-radius: 0; }
.assy input:active::-webkit-slider-thumb { transform: scale(1.12); }

/* title block */
.tb { position: absolute; right: 44px; bottom: 40px; width: min(410px, 32vw); border: 1.5px solid var(--ink); background: var(--paper); display: grid; grid-template-columns: 1fr 1fr 74px; font-size: 11px; }
.tb > div { border-right: .75px solid var(--ink); border-bottom: .75px solid var(--ink); padding: 6px 9px 7px; min-width: 0; }
.tb > div:nth-child(3n) { border-right: 0; }
.tb > div.wide { grid-column: span 2; }
.tb > div.full { grid-column: 1 / -1; border-right: 0; border-bottom: 0; }
.tb small { display: block; font-size: 8.5px; letter-spacing: .12em; color: var(--muted); margin-bottom: 2px; }
.tb b { font-weight: 500; }
.tb .email { user-select: all; }
.tb .contact { display: flex; flex-wrap: wrap; gap: 2px 14px; align-items: baseline; }
.tb .contact button, .tb .contact a { text-decoration: none; border-bottom: 1px solid var(--thin); }

@media (max-width: 820px) {
  :root { --S: min(190px, 48vw); --T: 7px; }
  body { overflow-x: hidden; overflow-y: auto; }
  .frame { display: none; }
  .app { height: auto; padding: 22px 16px calc(28px + env(safe-area-inset-bottom, 0px)); }
  .who { position: static; }
  .who { padding-top: 14px; }
  .who h1 { font-size: 40px; }
  .back { right: 16px; top: 12px; }
  .stage { position: relative; width: 100%; height: 430px; margin-top: 6px; touch-action: pan-y; cursor: default; }
  .lift { top: 56%; }
  svg.leaders { position: absolute; }
  .assy { position: static; width: 100%; margin: 4px 0 26px; }
  .calls { position: static; width: 100%; display: grid; gap: 16px; }
  .call { position: static; transform: none; }
  .tb { position: static; width: 100%; margin-top: 28px; }
}
@media (max-height: 760px) and (min-width: 821px) { .call p { display: none; } }
@media (prefers-reduced-motion: reduce) { .balloon, .plate .top, .plate .top img { transition: none; } }
</style>
</head>
<body>
<div class="frame" aria-hidden="true" id="frame"></div>
<div class="app" id="app">
  <header class="who">
    <h1>Hridae Walia</h1>
    <p><b>Product designer</b>, San Francisco · Founding designer at Domis</p>
  </header>
  <a class="back" href="../index.html">all sketches</a>

  <div class="stage" id="stage" role="img" aria-label="Exploded isometric view of five stacked layers: pencil and paper, Figma, code, hardware and sensors, people">
    <svg class="leaders" id="leaders" aria-hidden="true"></svg>
    <div class="lift" id="lift"><div class="iso" id="iso"></div></div>
  </div>

  <div class="assy">
    <label for="ex"><span>ASSEMBLED</span><span>EXPLODED</span></label>
    <input type="range" id="ex" min="0" max="100" value="100" aria-label="Assemble or explode the stack">
  </div>

  <ol class="calls" id="calls" aria-label="How I work, layer by layer"></ol>

  <div class="tb" id="tb">
    <div class="wide"><small>TITLE</small><b>How I work, exploded</b></div><div><small>SHEET</small>1 / 1</div>
    <div><small>DRAWN BY</small>H. Walia</div><div><small>DISCIPLINE</small>Interaction</div><div><small>SCALE</small>NTS</div>
    <div class="full contact"><span class="email" id="email">hridaew@gmail.com</span><button id="copy">copy</button><a href="https://www.linkedin.com/in/hridae" target="_blank" rel="noopener">LinkedIn</a><a href="https://drive.google.com/file/d/1f11tgSCoo4GY0DuVhdmOVG17lPRpGb3Z/view?usp=sharing" target="_blank" rel="noopener">CV</a></div>
  </div>
</div>
<script>
(() => {
  const L = [
    { k: "Pencil & paper", img: "media/paper.webp", p: "Sketching OBSCURA's booth: one visitor inside, an audience outside watching through their eyes.", links: [["OBSCURA", "https://hridaew.com/obscura"]] },
    { k: "Figma", img: "media/figma.webp", p: "Virdio's calibration flow, and a token system that cut handoff time 50% across four platforms.", links: [["Virdio", "https://hridaew.com/virdio"]] },
    { k: "Code", img: "media/code.webp", p: "Prototypes of an AI 3D home avatar lifted new-user engagement 60%; an agent reads appliance nameplates.", links: [["Domis", "https://hridaew.com/domis"], ["Savor", "https://hridaew.com/waffling/savor"]] },
    { k: "Hardware & sensors", img: "media/hardware.webp", p: "Plush cats with pressure sensors and haptic motors on an Arduino. Pet one and it purrs.", links: [["Memory Care", "https://hridaew.com/memory-care"], ["Baby J", "https://hridaew.com/waffling/orca"]] },
    { k: "People", img: "media/people.webp", p: "The base of the stack. 98% positive across 200+ sessions with residents living with dementia.", links: [["Memory Care", "https://hridaew.com/memory-care"]] },
  ];
  const N = L.length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const iso = document.getElementById("iso"), lift = document.getElementById("lift"), svg = document.getElementById("leaders");
  const stage = document.getElementById("stage"), calls = document.getElementById("calls"), ex = document.getElementById("ex");
  const NS = "http://www.w3.org/2000/svg";

  // zone marks on the drawing frame
  const fr = document.getElementById("frame");
  "ABCD".split("").forEach((c, i) => { [["left", "-1px"], ["right", "-1px"]].forEach(() => {}); const a = document.createElement("span"); a.className = "zone"; a.textContent = c; a.style.left = "-11px"; a.style.top = `${12.5 + i * 25}%`; fr.appendChild(a); const b = a.cloneNode(true); b.style.left = "auto"; b.style.right = "-11px"; fr.appendChild(b); });
  [1, 2, 3, 4, 5, 6].forEach((n, i) => { const a = document.createElement("span"); a.className = "zone"; a.textContent = n; a.style.top = "-11px"; a.style.left = `${100 / 12 + i * 100 / 6}%`; fr.appendChild(a); const b = a.cloneNode(true); b.style.top = "auto"; b.style.bottom = "-11px"; fr.appendChild(b); });

  const plates = L.map((l, i) => {
    const d = document.createElement("div"); d.className = "plate"; d.dataset.i = i;
    d.innerHTML = `<div class="pull"><div class="f fb"></div><div class="f ft"></div><div class="f fr"></div><div class="f fl"></div>
      <div class="top"><img src="${l.img}" alt="" draggable="false"></div>
      <span class="anc" style="left:0;top:0"></span><span class="anc" style="right:0;top:0"></span><span class="anc" style="right:0;bottom:0"></span><span class="anc" style="left:0;bottom:0"></span></div>`;
    iso.appendChild(d); return d;
  });
  const groups = L.map((l, i) => {
    const li = document.createElement("li"); li.className = "call"; li.dataset.i = i;
    li.innerHTML = `<span class="balloon">${i + 1}</span><div><h2>${l.k}</h2><p>${l.p}</p>${l.links.map(([t, h]) => `<a href="${h}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`;
    calls.appendChild(li);
    const g = document.createElementNS(NS, "g");
    g.innerHTML = `<path/><circle r="2.6"/>`;
    svg.appendChild(g);
    li.addEventListener("pointerenter", () => setOn(i)); li.addEventListener("pointerleave", () => setOn(-1));
    li.addEventListener("focusin", () => setOn(i)); li.addEventListener("focusout", () => setOn(-1));
    return { li, g, path: g.querySelector("path"), dot: g.querySelector("circle") };
  });
  const axis = document.createElementNS(NS, "path"); axis.setAttribute("class", "axis"); svg.prepend(axis);

  let on = -1;
  function setOn(i) {
    on = i;
    plates.forEach((p, j) => p.classList.toggle("on", j === i));
    groups.forEach((g, j) => { g.li.classList.toggle("on", j === i); g.g.classList.toggle("on", j === i); });
    iso.parentElement.parentElement.classList.toggle("dim", i >= 0);
    kick();
  }

  // explode value with a spring toward the target
  let e = reduce ? 1 : 0, v = 0, target = 1, last = performance.now(), Spx = 300, T = 10;
  function measure() {
    const cs = getComputedStyle(iso);
    Spx = iso.offsetWidth; T = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--T")) || 10;
  }
  const narrow = () => innerWidth <= 820;

  function layoutCalls() {
    if (narrow()) return;
    const top = 0.17, bot = innerHeight < 760 ? 0.68 : 0.7;
    groups.forEach((g, i) => { g.li.style.top = `${(top + (bot - top) * (i / (N - 1))) * innerHeight}px`; });
  }

  let rightIdx = 1;
  const pull = L.map(() => ({ x: 0, v: 0 }));
  const CORN = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
  function render() {
    const gap = Spx * (narrow() ? 0.4 : 0.52);
    const step = T + gap * e;
    const [dx, dy] = CORN[rightIdx], k = Spx * 0.13;
    plates.forEach((p, i) => {
      p.style.transform = `translateZ(${((N - 1 - i) * step).toFixed(2)}px)`;
      p.firstChild.style.transform = `translate(${(dx * k * pull[i].x).toFixed(2)}px, ${(dy * k * pull[i].x).toFixed(2)}px)`;
    });
    lift.style.transform = `translateY(${((N - 1) * step * 0.85 / 2).toFixed(1)}px)`;
    // leaders
    const sb = stage.getBoundingClientRect();
    const tops = [];
    plates.forEach((p, i) => {
      const a = p.querySelectorAll(".anc")[rightIdx].getBoundingClientRect();
      const x0 = a.left - sb.left, y0 = a.top - sb.top; tops.push([x0, y0]);
      const g = groups[i];
      if (narrow()) {
        // short leader to a balloon number beside the plate
        const x1 = Math.min(sb.width - 26, x0 + 34), y1 = y0 - 6;
        g.path.setAttribute("d", `M${x0} ${y0} L${x1 - 13} ${y1}`);
        g.dot.setAttribute("cx", x0); g.dot.setAttribute("cy", y0);
        let t = g.g.querySelector("text");
        if (!t) { const c = document.createElementNS(NS, "circle"); c.setAttribute("r", 12); c.setAttribute("class", "bl"); c.style.cssText = "fill:var(--paper);stroke:var(--ink);stroke-width:1.2"; g.g.appendChild(c); t = document.createElementNS(NS, "text"); t.textContent = i + 1; t.setAttribute("text-anchor", "middle"); t.style.cssText = "font:600 11px var(--f-mono);fill:var(--ink)"; g.g.appendChild(t); }
        const c = g.g.querySelector(".bl"); c.setAttribute("cx", x1); c.setAttribute("cy", y1); t.setAttribute("x", x1); t.setAttribute("y", y1 + 4);
      } else {
        const b = g.li.querySelector(".balloon").getBoundingClientRect();
        const x2 = b.left - sb.left - 3, y2 = b.top + b.height / 2 - sb.top, xs = x2 - 34;
        g.path.setAttribute("d", `M${x0.toFixed(1)} ${y0.toFixed(1)} L${xs.toFixed(1)} ${y2.toFixed(1)} L${x2.toFixed(1)} ${y2.toFixed(1)}`);
        g.dot.setAttribute("cx", x0.toFixed(1)); g.dot.setAttribute("cy", y0.toFixed(1));
      }
    });
    // centre line of the assembly through the plate centres
    const c0 = plates[0].getBoundingClientRect(), c1 = plates[N - 1].getBoundingClientRect();
    const cx = (c0.left + c0.right) / 2 - sb.left;
    axis.setAttribute("d", `M${cx} ${c0.top - sb.top - 30} L${cx} ${c1.bottom - sb.top + 30}`);
  }

  function tick(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    if (reduce) { e = target; v = 0; }
    else { const k = 260, c = 26; v += ((target - e) * k - v * c) * dt; e += v * dt; }
    let busy = Math.abs(target - e) > 0.0005 || Math.abs(v) > 0.0005;
    pull.forEach((q, i) => {
      const t = on === i ? 1 : 0;
      if (reduce) { q.x = t; q.v = 0; return; }
      q.v += ((t - q.x) * 340 - q.v * 24) * dt; q.x += q.v * dt;
      if (Math.abs(t - q.x) > 0.001 || Math.abs(q.v) > 0.001) busy = true; else q.x = t;
    });
    render();
    if (busy) requestAnimationFrame(tick); else { e = target; render(); running = false; }
  }
  let running = false;
  function kick() { if (!running) { running = true; last = performance.now(); requestAnimationFrame(tick); } }

  ex.addEventListener("input", () => { target = ex.value / 100; kick(); });
  // drag the stack itself: up explodes, down assembles
  let dragY = null, dragT = 0;
  stage.addEventListener("pointerdown", (ev) => { if (ev.pointerType === "touch" && narrow()) return; dragY = ev.clientY; dragT = target; stage.setPointerCapture(ev.pointerId); });
  stage.addEventListener("pointermove", (ev) => {
    if (dragY == null) return;
    target = Math.max(0, Math.min(1, dragT + (dragY - ev.clientY) / (Spx * 1.1)));
    ex.value = Math.round(target * 100); kick();
  });
  const up = () => { dragY = null; };
  stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
  // hovering a plate lights its callout
  stage.addEventListener("pointermove", (ev) => {
    if (dragY != null || ev.pointerType !== "mouse") return;
    const hit = document.elementsFromPoint(ev.clientX, ev.clientY).find((x) => x.classList && x.classList.contains("top"));
    const i = hit ? +hit.closest(".plate").dataset.i : -1; if (i !== on) setOn(i);
  });
  stage.addEventListener("pointerleave", () => setOn(-1));

  document.getElementById("copy").addEventListener("click", async (ev) => {
    const b = ev.currentTarget;
    try { await navigator.clipboard.writeText("hridaew@gmail.com"); b.textContent = "copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected"; }
    setTimeout(() => (b.textContent = "copy"), 1500);
  });

  function pickRight() {
    // which top-face corner lands furthest right on screen
    const xs = [...plates[0].querySelectorAll(".anc")].map((a) => a.getBoundingClientRect().left);
    rightIdx = xs.indexOf(Math.max(...xs));
  }
  addEventListener("resize", () => { measure(); layoutCalls(); pickRight(); render(); });
  measure(); layoutCalls(); pickRight();
  render();
  // opening move: the stack arrives assembled, then comes apart
  if (!reduce) { e = 0; ex.value = 100; setTimeout(() => { target = 1; kick(); }, 350); }
  else { e = 1; render(); }
})();
</script>
</body>
</html>
