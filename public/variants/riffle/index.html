<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Riffle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drum of photographic cards (a Rolodex) owns the centre; the front card's caption sits bottom-left; a quiet index runs down the right. */
:root {
  color-scheme: light;
  --wall: #D6D7D2; --ink: #131313; --muted: #5E605A; --rule: rgb(19 19 19 / .14);
  --f-sans: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: radial-gradient(ellipse 70% 60% at 56% 42%, #E3E4DF, var(--wall) 70%); color: var(--ink); font: 400 15px/1.5 var(--f-sans); overflow: hidden; -webkit-font-smoothing: antialiased; }
img, video { max-width: none; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

.top { position: fixed; left: clamp(20px, 3.5vw, 56px); top: clamp(20px, 4vh, 40px); z-index: 5; }
.top b { display: block; font: 600 17px/1.2 var(--f-sans); }
.top span { font: 400 12px/1.5 var(--f-mono); color: var(--muted); }

.stage { position: fixed; inset: 0; perspective: 1600px; perspective-origin: 61% 20%; touch-action: none; cursor: grab; }
.stage.drag { cursor: grabbing; }
.drum { position: absolute; left: 61%; top: 53%; width: min(52vw, 840px); aspect-ratio: 16 / 10; transform-style: preserve-3d; transform: translate(-50%, -50%); }
.card { position: absolute; inset: 0; transform-origin: 50% 100%; border-radius: 8px; overflow: hidden; background: #111; box-shadow: 0 1px 0 rgb(255 255 255 / .4) inset, 0 30px 60px -20px rgb(0 0 0 / .45), 0 8px 18px rgb(0 0 0 / .18); backface-visibility: hidden; will-change: transform, filter; text-decoration: none; }
.card img, .card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card .tab { position: absolute; left: 14px; top: 12px; font: 500 11px/1 var(--f-mono); color: #fff; mix-blend-mode: difference; letter-spacing: .04em; }
.card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(255 255 255 / .08), transparent 30%); pointer-events: none; }

.caption { position: fixed; left: clamp(20px, 3.5vw, 56px); bottom: clamp(24px, 6vh, 64px); z-index: 5; width: min(400px, 28vw); pointer-events: none; }
.caption > * { pointer-events: auto; }
.caption .n { font: 400 12px/1 var(--f-mono); color: var(--muted); }
.caption h1, .caption h2 { margin: 10px 0 8px; font: 500 clamp(40px, 5vw, 72px)/.95 var(--f-sans); letter-spacing: -.03em; text-wrap: balance; }
.caption .meta { font: 400 12px/1.5 var(--f-mono); color: var(--muted); margin: 0 0 10px; }
.caption p { margin: 0 0 14px; font-size: 16px; line-height: 1.5; max-width: 36ch; }
.caption .links a { font: 500 13px/1 var(--f-mono); margin-right: 16px; text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.caption .swap { transition: opacity .25s, transform .35s cubic-bezier(.2,.8,.2,1); }
.caption .swap.out { opacity: 0; transform: translateY(8px); }

.index { position: fixed; right: clamp(20px, 3.5vw, 56px); top: 50%; transform: translateY(-50%); z-index: 5; list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; text-align: right; }
.index button { font: 400 12px/1.6 var(--f-mono); color: var(--muted); transition: color .2s; }
.index button[aria-current="true"] { color: var(--ink); }
.index button[aria-current="true"]::before { content: "— "; }
.contact { position: fixed; right: clamp(20px, 3.5vw, 56px); bottom: clamp(24px, 6vh, 64px); z-index: 5; font: 400 12px/1.6 var(--f-mono); text-align: right; }
.contact .email { user-select: all; }
.contact button, .contact a { text-decoration: none; border-bottom: 1px solid var(--rule); margin-left: 10px; }
.hint { position: fixed; left: 50%; top: clamp(20px, 4vh, 40px); transform: translateX(-50%); font: 400 11px/1 var(--f-mono); color: var(--muted); z-index: 5; }

@media (max-width: 820px) {
  .drum { left: 50%; top: 52%; width: 86vw; }
  .stage { perspective-origin: 50% 10%; bottom: 46%; top: 70px; }
  .caption { left: 20px; right: 20px; width: auto; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .caption h1, .caption h2 { font-size: 40px; }
  .caption p { font-size: 15px; }
  .index { display: none; }
  .contact { left: 20px; right: 20px; text-align: left; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .hint { display: none; }
}
@media (max-height: 640px) and (min-width: 821px) { .caption p { display: none; } }
</style>
</head>
<body>
<header class="top"><b>Hridae Walia</b><span>Interaction &amp; product designer</span></header>
<div class="stage" id="stage" aria-hidden="false"><div class="drum" id="drum"></div></div>
<section class="caption" aria-live="polite"><div class="swap" id="cap"></div></section>
<nav aria-label="Work"><ol class="index" id="index"></ol></nav>
<footer class="contact"><span class="email" id="email">hridaew@gmail.com</span><button id="copy">copy</button><a href="https://www.linkedin.com/in/hridae" target="_blank" rel="noopener">LinkedIn</a><a href="https://drive.google.com/file/d/1f11tgSCoo4GY0DuVhdmOVG17lPRpGb3Z/view?usp=sharing" target="_blank" rel="noopener">CV</a></footer>
<p class="hint" aria-hidden="true">drag, scroll or ↑ ↓ to riffle</p>
<script>
(() => {
  const CARDS = [
    { t: "Hridae Walia", tag: "Hello", img: "media/me.webp", meta: "Interaction & product designer · San Francisco",
      p: "I design for interaction models that barely exist yet, and I learn by making: on the canvas, in code, and in the physical world. Me and my cat, above.",
      links: [["CV", "https://drive.google.com/file/d/1f11tgSCoo4GY0DuVhdmOVG17lPRpGb3Z/view?usp=sharing"], ["LinkedIn", "https://www.linkedin.com/in/hridae"]] },
    { t: "Domis", tag: "Domis", img: "media/domis.webp", meta: "Founding Product Designer · 2024–now",
      p: "A home maintenance app that learns your house from the smallest thing you'll give it: an address, a nameplate photo, an inspection report. My 3D home-avatar prototypes lifted new-user engagement 60%.",
      href: "https://hridaew.com/domis" },
    { t: "Virdio", tag: "Virdio", img: "media/virdio.webp", video: "media/virdio.mp4", meta: "Product Designer · 2021–2022",
      p: "AR fitness with no hardware: an ordinary camera reads your body and counts every rep. Shipped on six platforms, with a token system that halved handoff time.",
      href: "https://hridaew.com/virdio" },
    { t: "OBSCURA", tag: "OBSCURA", img: "media/obscura.webp", video: "media/obscura.mp4", meta: "Interaction design, Unity · MOHAI, 2025",
      p: "300+ never-seen photographs from 1946 Japan, curated by a visitor's gaze in VR while an audience watches through their eyes. Sold out.",
      href: "https://hridaew.com/obscura" },
    { t: "Memory Care", tag: "Memory Care", img: "media/mc.webp", meta: "Interaction Designer · 2020–2023",
      p: "Plush cats wired with pressure sensors and haptic motors, for people living with dementia. Pet one and it purrs. 98% positive across 200+ sessions.",
      href: "https://hridaew.com/memory-care" },
    { t: "Savor", tag: "Savor", img: "media/savor.webp", meta: "Side build · macOS",
      p: "Turns a phone video into a 3D Gaussian splat you can orbit, trained on-device. Built to capture Rodin's Mighty Hand properly.",
      href: "https://hridaew.com/waffling/savor" },
    { t: "Saving Baby J", tag: "Baby J", img: "media/orca.webp", meta: "Side build · arcade game",
      p: "Throw plush orcas at a projected hit board to free a calf from a net. I tested two controllers; the throw won, and nobody needed a tutorial.",
      href: "https://hridaew.com/waffling/orca" },
    { t: "Recorder", tag: "Recorder", img: "media/recorder.webp", meta: "Side build · prototype",
      p: "A voice recorder you scrub like a turntable, with a cassette-eject sound.",
      href: "https://hridaew.com/waffling/recorder" },
    { t: "Butter Chicken", tag: "Butter chicken", img: "media/butter.webp", meta: "Side build · recipe",
      p: "A vibes-based recipe. Taste scales linearly with butter.",
      href: "https://hridaew.com/butter-chicken" },
  ];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const drum = document.getElementById("drum"), stage = document.getElementById("stage"), idx = document.getElementById("index");
  const els = CARDS.map((c, i) => {
    const a = document.createElement(c.href ? "a" : "div");
    a.className = "card";
    if (c.href) { a.href = c.href; a.target = "_blank"; a.rel = "noopener"; }
    a.setAttribute("aria-label", c.href ? `${c.t}, open case study` : c.t);
    a.tabIndex = -1;
    a.innerHTML = c.video
      ? `<video muted loop playsinline preload="none" poster="${c.img}" src="${c.video}"></video>`
      : `<img src="${c.img}" alt="" draggable="false" ${i > 2 ? 'loading="lazy"' : ""}>`;
    a.insertAdjacentHTML("beforeend", `<span class="tab">${String(i + 1).padStart(2, "0")} ${c.tag}</span>`);
    drum.appendChild(a);
    const li = document.createElement("li"); li.innerHTML = `<button>${c.tag}</button>`;
    li.firstChild.addEventListener("click", () => goTo(i)); idx.appendChild(li);
    return a;
  });

  let pos = 0, vel = 0, dragging = false, active = -1, lastT = performance.now();
  const STEP = 15; // degrees between cards
  function radius() { return drum.offsetHeight * 1.9; }

  function render() {
    const R = radius();
    els.forEach((el, i) => {
      const rel = i - pos, a = Math.abs(rel);
      if (rel > 6 || rel < -1.4) { el.style.visibility = "hidden"; return; }
      el.style.visibility = "visible";
      let tf, op = 1, br = 1;
      if (rel >= 0) {
        // waiting cards: stacked behind, leaning back, top edges peeking
        const h = drum.offsetHeight;
        tf = `translate3d(0, ${(-rel * h * 0.075).toFixed(1)}px, ${(-rel * 70).toFixed(1)}px) rotateX(${(rel * 5).toFixed(2)}deg)`;
        br = 1 - Math.min(0.5, rel * 0.13); op = rel > 4 ? Math.max(0, 5 - rel) : 1;
      } else {
        // passed cards flip forward and down on the bottom hinge
        const k = Math.min(1, -rel);
        tf = `translate3d(0, 0, ${(k * 30).toFixed(1)}px) rotateX(${(-k * 98).toFixed(2)}deg)`;
        op = Math.max(0, 1 - Math.max(0, -rel - 0.6) * 2.5); br = 1 - k * 0.35;
      }
      el.style.transform = tf;
      el.style.zIndex = String(rel >= 0 ? 100 - Math.round(rel * 10) : 101);
      el.style.filter = `brightness(${br.toFixed(3)})`;
      el.style.opacity = op.toFixed(3);
    });
    const near = Math.round(Math.max(0, Math.min(CARDS.length - 1, pos)));
    if (near !== active) setActive(near);
  }

  function setActive(i) {
    const prev = active; active = i;
    els.forEach((el, j) => { el.tabIndex = j === i ? 0 : -1; const v = el.querySelector("video"); if (v) { if (j === i && !reduce) v.play().catch(() => {}); else v.pause(); } });
    [...idx.children].forEach((li, j) => li.firstChild.setAttribute("aria-current", j === i));
    const c = CARDS[i], cap = document.getElementById("cap");
    const html = `<div class="n">${String(i + 1).padStart(2, "0")} / ${String(CARDS.length).padStart(2, "0")}</div>
      <${i === 0 ? "h1" : "h2"}>${c.t}</${i === 0 ? "h1" : "h2"}><p class="meta">${c.meta}</p><p>${c.p}</p>
      <div class="links">${(c.links || [["Case study", c.href]]).map(([l, h]) => `<a href="${h}" target="_blank" rel="noopener">${l} ↗</a>`).join("")}</div>`;
    if (prev === -1 || reduce) { cap.innerHTML = html; return; }
    cap.classList.add("out");
    clearTimeout(setActive.t); setActive.t = setTimeout(() => { cap.innerHTML = html; cap.classList.remove("out"); }, 160);
  }

  function goTo(i) { target = i; vel = 0; if (reduce) { pos = i; render(); } }
  let target = null;

  function tick(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    if (!dragging) {
      if (target != null) {
        const k = 90, c = 2 * Math.sqrt(k) * 0.9;
        vel += ((target - pos) * k - vel * c) * dt; pos += vel * dt;
        if (Math.abs(target - pos) < 0.001 && Math.abs(vel) < 0.01) { pos = target; vel = 0; target = null; }
      } else if (Math.abs(vel) > 0.9) {
        pos += vel * dt; vel *= Math.pow(0.12, dt);
      } else {
        target = Math.round(Math.max(0, Math.min(CARDS.length - 1, pos)));
      }
      // rubber band past the ends
      if (pos < -0.4) { pos = -0.4; vel = 0; } if (pos > CARDS.length - 0.6) { pos = CARDS.length - 0.6; vel = 0; }
    }
    render();
    requestAnimationFrame(tick);
  }

  /* drag */
  let sy = 0, sp = 0, samples = [];
  stage.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    dragging = true; target = null; stage.classList.add("drag"); stage.setPointerCapture(e.pointerId);
    sy = e.clientY; sp = pos; samples = [[performance.now(), e.clientY]]; stage.dataset.moved = "";
  });
  stage.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const per = drum.offsetHeight * 0.42;
    pos = sp - (e.clientY - sy) / per;
    samples.push([performance.now(), e.clientY]); if (samples.length > 6) samples.shift();
    if (Math.abs(e.clientY - sy) > 6) stage.dataset.moved = "1";
  });
  const end = (e) => {
    if (!dragging) return; dragging = false; stage.classList.remove("drag");
    const per = drum.offsetHeight * 0.42, [t0, y0] = samples[0], [t1, y1] = samples[samples.length - 1];
    vel = t1 > t0 ? -((y1 - y0) / per) / ((t1 - t0) / 1000) : 0;
    vel = Math.max(-14, Math.min(14, vel));
    if (!stage.dataset.moved) {
      // a tap: front card opens, others come forward
      const hit = document.elementsFromPoint(e.clientX, e.clientY).find((x) => x.classList && x.classList.contains("card"));
      const i = hit ? els.indexOf(hit) : -1;
      if (i === active && CARDS[i].href) { const a = document.createElement("a"); a.href = CARDS[i].href; a.target = "_blank"; a.rel = "noopener"; a.click(); }
      else if (i >= 0) goTo(i);
    }
  };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", end);
  // pointer taps are handled above; keyboard Enter on the focused front card follows its link natively
  els.forEach((el) => el.addEventListener("click", (e) => { if (e.detail !== 0) e.preventDefault(); }));

  addEventListener("wheel", (e) => { e.preventDefault(); target = null; vel += (e.deltaY + e.deltaX) * 0.012; vel = Math.max(-14, Math.min(14, vel)); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowRight" || e.key === "j") { e.preventDefault(); goTo(Math.min(CARDS.length - 1, (target ?? active) + 1)); }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft" || e.key === "k") { e.preventDefault(); goTo(Math.max(0, (target ?? active) - 1)); }
  });

  document.getElementById("copy").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText("hridaew@gmail.com"); b.textContent = "copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected"; }
    setTimeout(() => (b.textContent = "copy"), 1500);
  });

  render();
  if (!reduce) { pos = 3.2; vel = 0; target = 0; } // opening riffle: the deck settles onto the first card
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
