<style>
/* Layout: a few thousand soft gaussians fill the right of a cool sheet; a quiet index on the left. */
:root {
  color-scheme: light;
  --sheet: #ECEFF2; --ink: #0E1116; --muted: #5B6470; --line: #2236F0; --rule: rgb(14 17 22 / .12);
  --f-serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--sheet); color: var(--ink); font: 400 15px/1.55 var(--f-mono); overflow: hidden; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--line); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { position: relative; height: 100%; display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
.side { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: space-between; padding: clamp(28px, 5vh, 56px) 0 clamp(24px, 4vh, 44px) clamp(24px, 4vw, 64px); min-height: 0; pointer-events: none; }
.side > * { pointer-events: auto; }
.who h1 { margin: 0; font: 400 34px/1 var(--f-serif); letter-spacing: -.01em; }
.who p { margin: 8px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .02em; }

.index { list-style: none; margin: 0; padding: 0; }
.index li { border-top: 1px solid var(--rule); }
.index li:last-child { border-bottom: 1px solid var(--rule); }
.index button { width: 100%; display: flex; align-items: baseline; gap: 14px; padding: 11px 0; text-align: left; }
.index .n { font-size: 11px; color: var(--muted); width: 18px; }
.index .t { font: 400 26px/1.05 var(--f-serif); transition: color .3s, transform .5s cubic-bezier(.2,.8,.2,1); }
.index li:not(.on) .t { color: rgb(14 17 22 / .38); }
.index button:hover .t { color: var(--ink); }
.index li.on .t { font-style: italic; transform: translateX(6px); }
.detail { overflow: hidden; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s cubic-bezier(.2,.8,.2,1); }
.index li.on .detail { grid-template-rows: 1fr; }
.detail > div { min-height: 0; padding: 0 0 0 32px; }
.detail p { margin: 0 0 8px; font-size: 13px; line-height: 1.6; max-width: 34ch; }
.detail .meta { color: var(--muted); font-size: 11px; letter-spacing: .03em; margin-bottom: 6px; }
.detail a { display: inline-block; margin: 2px 14px 14px 0; font-size: 12px; text-decoration: none; border-bottom: 1px solid var(--line); color: var(--line); }

.contact { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; color: var(--muted); }
.contact .email { color: var(--ink); user-select: all; }
.contact button, .contact a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule); }

.fig { position: absolute; z-index: 2; right: clamp(20px, 3vw, 48px); bottom: clamp(20px, 4vh, 40px); text-align: right; font-size: 11px; color: var(--muted); pointer-events: none; }
.fig b { font-weight: 500; color: var(--ink); }
.hint { position: absolute; z-index: 2; right: clamp(20px, 3vw, 48px); top: clamp(28px, 5vh, 56px); font-size: 11px; color: var(--muted); }

@media (max-width: 820px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  canvas { position: fixed; height: 58vh; height: 58svh; }
  .side { padding: 20px 20px 32px; min-height: 100svh; justify-content: flex-start; gap: 0; }
  .who { margin-bottom: calc(58svh - 72px); }
  .who h1 { font-size: 28px; }
  .index { background: var(--sheet); margin: 0 -20px; padding: 0 20px; }
  .index .t { font-size: 24px; }
  .contact { background: var(--sheet); margin: 0 -20px; padding: 18px 20px 8px; }
  .fig { position: fixed; top: calc(58svh - 30px); bottom: auto; right: 20px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .index .t, .detail { transition: none; } }
</style>

        2 ** (u[o + 4] / 25 - 10), 2 ** (u[o + 5] / 25 - 10), (u[o + 6] / 255) * Math.PI,
        u[o + 7] / 255, u[o + 8] / 255, u[o + 9] / 255, al[i] / 255, i]); // last: draw rank (big first)
    }
    raw.forEach((r) => (r.h = hil(Math.round((r[0] + 1) * 511.5), Math.round((r[1] + 1) * 511.5))));
    raw.sort((a, b) => a.h - b.h);
    const extra = new Set(); while (extra.size < NMAX - n) extra.add((rnd() * n) | 0);
    const out = new Float32Array(NMAX * F), rank = new Float32Array(NMAX);
    let j = 0;
    raw.forEach((r, i) => {
      out.set(r.slice(0, F), j * F); rank[j] = r[9]; j++;
      if (extra.has(i) && j < NMAX) { out.set(r.slice(0, F), j * F); out[j * F + 8] = 0; rank[j] = r[9]; j++; }
    });
    const order = Array.from({ length: NMAX }, (_, i) => i).sort((a, b) => rank[a] - rank[b]);
    SETS[k] = { d: out, order: Uint16Array.from(order), n };
  }

  /* ── GL ── */
  const cv = document.getElementById("c");
  const gl = cv.getContext("webgl", { premultipliedAlpha: true, antialias: false, alpha: true });
  const ext = gl && gl.getExtension("ANGLE_instanced_arrays");
  if (!gl || !ext) { document.getElementById("fig").textContent = "This page needs WebGL to draw its splats."; }
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const prog = gl && gl.createProgram();
  if (gl) {
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, `
      attribute vec2 q; attribute vec2 c; attribute vec3 s; attribute vec4 col;
      uniform vec2 res; varying vec2 uv; varying vec4 vc;
      void main(){
        float ca = cos(s.z), sa = sin(s.z);
        vec2 sz = max(s.xy, vec2(.7));
        vec2 d = q * 3.0;
        vec2 p = c + vec2(d.x*sz.x*ca - d.y*sz.y*sa, d.x*sz.x*sa + d.y*sz.y*ca);
        uv = d; vc = col;
        gl_Position = vec4(p / res * 2.0 - 1.0, 0.0, 1.0); gl_Position.y = -gl_Position.y;
      }`));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
      precision mediump float; varying vec2 uv; varying vec4 vc;
      void main(){ float g = exp(-.5 * dot(uv, uv)) * vc.a; if (g < .004) discard; gl_FragColor = vec4(vc.rgb * g, g); }`));
    gl.linkProgram(prog); gl.useProgram(prog);
  }
  const L = (n) => gl.getAttribLocation(prog, n);
  let inst, vbuf;
  const G = new Float32Array(NMAX * F);
  if (gl) {
    const qb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, qb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(L("q")); gl.vertexAttribPointer(L("q"), 2, gl.FLOAT, false, 0, 0);
    vbuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbuf); gl.bufferData(gl.ARRAY_BUFFER, G.byteLength, gl.DYNAMIC_DRAW);
    [["c", 2, 0], ["s", 3, 2], ["col", 4, 5]].forEach(([n, sz, off]) => { const l = L(n); gl.enableVertexAttribArray(l); gl.vertexAttribPointer(l, sz, gl.FLOAT, false, F * 4, off * 4); ext.vertexAttribDivisorANGLE(l, 1); });
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  }

  let W = 0, H = 0, dpr = 1, box = { cx: 0, cy: 0, s: 1 };
  function layout() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    if (gl) { gl.viewport(0, 0, cv.width, cv.height); gl.uniform2f(gl.getUniformLocation(prog, "res"), W, H); }
    const narrow = innerWidth <= 820, side = narrow ? 0 : Math.min(400, Math.max(300, W * 0.28));
    const aw = W - side;
    box = { cx: side + aw / 2, cy: narrow ? H * 0.56 : H / 2, s: Math.min(aw, H) * (narrow ? 0.4 : 0.41) };
  }

  /* state: from → target per splat, plus a pointer-driven displacement spring */
  const from = new Float32Array(NMAX * F), cur = new Float32Array(NMAX * F);
  const D = new Float32Array(NMAX * 2), V = new Float32Array(NMAX * 2), HSH = new Float32Array(NMAX);
  for (let i = 0; i < NMAX; i++) HSH[i] = rnd() - 0.5;
  let target = SETS.me, ci = 0, t0 = 0, dur = 1600, morphing = false, order = target.order;

  // the opening "cloud": the first set's own splats, gathered small and faint at the centre
  for (let i = 0; i < NMAX; i++) {
    const o = i * F, r = Math.sqrt(-2 * Math.log(rnd() + 1e-6)) * 0.16, a = rnd() * Math.PI * 2;
    from.set(target.d.subarray(o, o + F), o);
    from[o] = Math.cos(a) * r; from[o + 1] = Math.sin(a) * r; from[o + 2] *= 0.2; from[o + 3] *= 0.2; from[o + 8] = 0;
  }
  cur.set(from);

  const mouse = { x: -1e4, y: -1e4 };
  addEventListener("pointermove", (e) => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; }, { passive: true });
  document.addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });

  function go(i, first) {
    i = (i + CH.length) % CH.length;
    if (i === ci && !first) return;
    ci = i;
    if (!first) from.set(cur);
    target = SETS[CH[i].k]; t0 = performance.now(); morphing = true; dur = first ? 2400 : 1600;
    [...idx.children].forEach((li, j) => { li.classList.toggle("on", j === i); li.querySelector("button").setAttribute("aria-expanded", j === i); });
    document.getElementById("fig").innerHTML = `<b>fig. ${i + 1}</b> &nbsp;${CH[i].fig}, as ${target.n.toLocaleString("en-US")} gaussians`;
    cv.setAttribute("aria-label", `${CH[i].t}: ${CH[i].fig}, drawn with soft gaussian splats`);
    if (reduce) { cur.set(target.d); from.set(target.d); morphing = false; }
  }

  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  function frame(now) {
    if (!gl) return;
    const mt = morphing ? (now - t0) / dur : 2;
    if (mt >= 1.4) { morphing = false; order = target.order; }
    else if (mt > 0.55) order = target.order;
    const T = target.d, s = box.s;
    for (let i = 0; i < NMAX; i++) {
      const o = i * F;
      if (morphing) {
        const k = ease(Math.min(1, Math.max(0, mt * 1.4 - (i / NMAX) * 0.4))), lift = Math.sin(k * Math.PI);
        for (let f = 0; f < F; f++) cur[o + f] = from[o + f] + (T[o + f] - from[o + f]) * k;
        // mid-flight: shrink to a fine dust and swing sideways along the path, then re-form
        const dx = T[o] - from[o], dy = T[o + 1] - from[o + 1];
        cur[o] += -dy * lift * HSH[i] * 0.9; cur[o + 1] += dx * lift * HSH[i] * 0.9 - lift * 0.04;
        cur[o + 2] *= 1 - lift * 0.6; cur[o + 3] *= 1 - lift * 0.6;
        cur[o + 4] = from[o + 4] + (((T[o + 4] - from[o + 4] + Math.PI * 1.5) % Math.PI) - Math.PI / 2) * k;
      } else if (!reduce) {
        for (let f = 0; f < F; f++) cur[o + f] = T[o + f];
      }
      // pointer: splats near it are pushed away and spring back
      const px = box.cx + cur[o] * s + D[i * 2], py = box.cy + cur[o + 1] * s + D[i * 2 + 1];
      const ddx = px - mouse.x, ddy = py - mouse.y, d2 = ddx * ddx + ddy * ddy;
      let fx = 0, fy = 0;
      if (!reduce && d2 < 8100) { const d = Math.sqrt(d2) || 1, ff = (1 - d / 90) * 3.2; fx = (ddx / d) * ff; fy = (ddy / d) * ff; }
      V[i * 2] = (V[i * 2] - D[i * 2] * 0.08 + fx) * 0.8; V[i * 2 + 1] = (V[i * 2 + 1] - D[i * 2 + 1] * 0.08 + fy) * 0.8;
      D[i * 2] += V[i * 2]; D[i * 2 + 1] += V[i * 2 + 1];
    }
    // pack in draw order (big soft splats underneath, detail on top)
    const wob = reduce ? 0 : 0.5;
    for (let r = 0; r < NMAX; r++) {
      const i = order[r], o = i * F, g = r * F;
      G[g] = box.cx + cur[o] * s + D[i * 2] + Math.sin(now / 900 + i * 0.37) * wob;
      G[g + 1] = box.cy + cur[o + 1] * s + D[i * 2 + 1] + Math.cos(now / 1100 + i * 0.29) * wob;
      const push = Math.min(1, Math.hypot(D[i * 2], D[i * 2 + 1]) / 30);
      G[g + 2] = cur[o + 2] * s * (1 + push * 0.6); G[g + 3] = cur[o + 3] * s * (1 + push * 0.6); G[g + 4] = cur[o + 4];
      G[g + 5] = cur[o + 5]; G[g + 6] = cur[o + 6]; G[g + 7] = cur[o + 7]; G[g + 8] = cur[o + 8];
    }
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.bindBuffer(gl.ARRAY_BUFFER, vbuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, G);
    ext.drawArraysInstancedANGLE(gl.TRIANGLE_STRIP, 0, 4, NMAX);
    if (!document.hidden) requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) requestAnimationFrame(frame); });

  /* ── input: one chapter per gesture ── */
  let lock = 0;
  const step = (d) => { const now = performance.now(); if (now < lock) return; lock = now + 900; go(ci + d); };
  addEventListener("wheel", (e) => { if (innerWidth <= 820) return; if (Math.abs(e.deltaY) + Math.abs(e.deltaX) < 8) return; e.preventDefault(); step(e.deltaY + e.deltaX > 0 ? 1 : -1); }, { passive: false });
  addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowRight") { e.preventDefault(); step(1); }
    if (e.key === "ArrowUp" || e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  });
  let sx = null, sy = null;
  cv.addEventListener("pointerdown", (e) => { sx = e.clientX; sy = e.clientY; });
  addEventListener("pointerup", (e) => { if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1); });

  document.getElementById("copy").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText("hridaew@gmail.com"); b.textContent = "copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents(document.getElementById("email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected"; }
    setTimeout(() => (b.textContent = "copy"), 1500);
  });

  addEventListener("resize", layout);
  layout();
  go(0, true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
