<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hit Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Martian+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a dark room. One big flip-dot board, a floor with the orca, a single quiet bar. A panel slides in with the work on a hit. */
:root {
  color-scheme: dark;
  --room: #0B0B0B; --wall: #121212; --disc: #F2EDE4; --dim: #8C877F; --line: rgb(242 237 228 / .14);
  --f-mono: "Martian Mono", ui-monospace, Menlo, monospace;
  --f-sans: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: radial-gradient(ellipse 80% 60% at 50% 30%, #181818, var(--room) 70%); color: var(--disc); font: 400 14px/1.55 var(--f-sans); -webkit-font-smoothing: antialiased; }
img, video { max-width: none; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--disc); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.room { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; padding: clamp(18px, 4vh, 40px) clamp(16px, 4vw, 56px) 0; max-width: 1400px; margin: 0 auto; }
.board-frame { position: relative; padding: 10px; border-radius: 6px; background: #050505; box-shadow: 0 0 0 1px #1d1d1d, 0 40px 80px -30px rgb(0 0 0 / .9), 0 0 120px -40px rgb(242 237 228 / .12); }
canvas#board { display: block; width: 100%; border-radius: 2px; }
.reticle { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 1.5px solid var(--disc); border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity 120ms; z-index: 3; }
.reticle::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: var(--disc); }
.reticle.on { opacity: .9; }

.floor { position: relative; height: clamp(150px, 22vh, 210px); }
.floor::before { content: ""; position: absolute; left: 0; right: 0; top: 58%; height: 1px; background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); }
.orca { position: absolute; left: 50%; top: 22%; width: 120px; height: 74px; margin-left: -60px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; z-index: 4; }
.orca:active { cursor: grabbing; }
.orca svg { width: 100%; height: 100%; filter: drop-shadow(0 10px 10px rgb(0 0 0 / .6)); }
.orca::after { content: ""; position: absolute; left: 10%; right: 10%; bottom: -14px; height: 10px; border-radius: 50%; background: rgb(0 0 0 / .6); filter: blur(6px); z-index: -1; }
.band { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 3; }
.hint { position: absolute; left: 50%; top: 72%; transform: translateX(-50%); font: 400 11px/1.4 var(--f-mono); color: var(--dim); white-space: nowrap; }

.bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; padding: 18px 0 calc(22px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); font: 400 12px/1.5 var(--f-mono); color: var(--dim); }
.bar .picks { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.bar .picks button { color: var(--disc); border-bottom: 1px solid transparent; }
.bar .picks button:hover { border-bottom-color: var(--disc); }
.bar .picks button[data-done]::before { content: "● "; font-size: 8px; vertical-align: 2px; }
.bar .me { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.bar .email { color: var(--disc); user-select: all; }
.bar a, .bar .me button { color: var(--disc); text-decoration: none; border-bottom: 1px solid var(--line); }

.flyer { position: fixed; left: 0; top: 0; width: 120px; height: 74px; pointer-events: none; z-index: 30; display: none; will-change: transform; }
.flyer svg { width: 100%; height: 100%; }
.shadow { position: fixed; left: 0; top: 0; width: 110px; height: 22px; margin: -11px 0 0 -55px; border-radius: 50%; background: rgb(0 0 0 / .7); pointer-events: none; z-index: 29; display: none; }

.panel { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: #151515; box-shadow: -30px 0 60px rgb(0 0 0 / .5); transform: translateX(105%); transition: transform .5s cubic-bezier(.2,.8,.2,1); overflow-y: auto; overscroll-behavior: contain; padding: 28px 28px calc(28px + env(safe-area-inset-bottom, 0px)); }
.panel.open { transform: none; }
.panel .close { position: absolute; right: 18px; top: 18px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); font: 400 16px/1 var(--f-mono); }
.panel .kicker { font: 400 11px/1.4 var(--f-mono); color: var(--dim); margin: 6px 0 10px; }
.panel h2 { margin: 0 0 6px; font: 500 40px/1 var(--f-sans); letter-spacing: -.02em; }
.panel .meta { font: 400 12px/1.5 var(--f-mono); color: var(--dim); margin: 0 0 18px; }
.panel .media { margin: 0 0 18px; border-radius: 4px; overflow: hidden; background: #000; aspect-ratio: 16 / 10; }
.panel .media img, .panel .media video { width: 100%; height: 100%; object-fit: cover; }
.panel .media.portrait img, .panel .media.portrait video { object-fit: contain; }
.panel p { margin: 0 0 14px; font-size: 16px; line-height: 1.55; }
.panel .links a { display: inline-block; margin: 4px 16px 4px 0; font: 500 13px/1 var(--f-mono); text-decoration: none; border-bottom: 1px solid var(--disc); padding-bottom: 3px; }
.panel ul { list-style: none; padding: 0; margin: 8px 0 0; }
.panel li { padding: 10px 0; border-top: 1px solid var(--line); }
.panel li a { font-weight: 600; text-decoration: none; }
.panel li span { display: block; color: var(--dim); font-size: 13px; }
.panel .log { white-space: pre-wrap; font: 400 12px/1.7 var(--f-mono); color: var(--dim); }
@media (max-width: 700px) {
  .panel { top: auto; width: 100%; max-height: 78svh; border-radius: 14px 14px 0 0; transform: translateY(105%); box-shadow: 0 -30px 60px rgb(0 0 0 / .6); }
  .panel h2 { font-size: 32px; }
  .bar { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<h1 class="sr">Hridae Walia, interaction and product designer</h1>
<main class="room">
  <div class="board-frame" id="frame">
    <canvas id="board" role="img" aria-label="Flip-dot board showing HRIDAE WALIA and four targets"></canvas>
    <div class="reticle" id="reticle"></div>
  </div>
  <div class="floor" id="floor">
    <svg class="band" id="band" aria-hidden="true"><line id="bandline" x1="0" y1="0" x2="0" y2="0" stroke="#F2EDE4" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="4 5" stroke-linecap="round"/></svg>
    <button class="orca" id="orca" aria-label="Plush orca. Drag it back and let go to throw it at the board. Or pick a project below.">
      <svg viewBox="0 0 132 82" aria-hidden="true"><use href="#orca-art"/></svg>
    </button>
    <p class="hint" aria-hidden="true">pull the orca back and let go · <span id="count">0 throws</span></p>
  </div>
  <footer class="bar">
    <div class="picks" role="group" aria-label="Or go straight to a project">
      <span>or pick:</span>
      <button data-t="0">Domis</button><button data-t="1">Virdio</button><button data-t="2">OBSCURA</button><button data-t="3">Memory Care</button><button data-t="4">About</button>
    </div>
    <div class="me">
      <span class="email" id="email">hridaew@gmail.com</span><button id="copy">copy</button>
      <a href="https://www.linkedin.com/in/hridae" target="_blank" rel="noopener">LinkedIn</a>
      <a href="https://drive.google.com/file/d/1f11tgSCoo4GY0DuVhdmOVG17lPRpGb3Z/view?usp=sharing" target="_blank" rel="noopener">CV</a>
      <button id="sound" aria-pressed="false">sound off</button>
    </div>
  </footer>
</main>
<aside class="panel" id="panel" aria-labelledby="p-title" aria-live="polite">
  <button class="close" id="p-close" aria-label="Close">×</button>
  <p class="kicker" id="p-kicker"></p>
  <h2 id="p-title"></h2>
  <p class="meta" id="p-meta"></p>
  <div class="media" id="p-media"></div>
  <div id="p-body"></div>
</aside>
<div class="shadow" id="shadow"></div>
<div class="flyer" id="flyer" aria-hidden="true"><svg viewBox="0 0 132 82"><use href="#orca-art"/></svg></div>
<p class="sr" id="live" aria-live="polite"></p>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="orca-art">
      <path d="M10 48 C 14 22, 52 12, 84 18 C 104 22, 118 30, 124 38 C 128 44, 120 50, 108 50 L 100 58 C 96 64, 88 62, 88 56 L 60 60 C 40 64, 22 62, 10 48 Z" fill="#161616"/>
      <path d="M58 18 C 62 4, 70 0, 74 2 C 70 8, 70 14, 72 20 Z" fill="#161616"/>
      <path d="M20 52 C 34 60, 60 60, 86 54 C 80 62, 46 66, 24 58 Z" fill="#F2EDE4"/>
      <ellipse cx="96" cy="32" rx="9" ry="4.5" fill="#F2EDE4" transform="rotate(-10 96 32)"/>
      <path d="M8 46 C 0 40, 0 30, 4 26 C 8 34, 12 38, 16 42 Z M8 50 C 0 56, 0 64, 4 68 C 8 60, 12 56, 16 52 Z" fill="#161616"/>
      <path d="M10 48 C 14 22, 52 12, 84 18 C 104 22, 118 30, 124 38" stroke="#2a2a2a" stroke-width="1" fill="none"/>
    </g>
  </defs>
</svg>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canvas = $("#board"), ctx = canvas.getContext("2d");
  const frame = $("#frame");

  const PROJECTS = [
    { key: "domis", label: "DOMIS", img: "media/d-domis.png", gamma: 1.0, lines: ["ADDRESS.", "PHOTO.", "REPORT."], stat: "+60% ENGAGEMENT",
      href: "https://hridaew.com/domis", media: { video: "media/domis.mp4", poster: "media/domis-poster.webp", portrait: true },
      body: "Founding Product Designer, Nov 2024–now. Domis is a home maintenance app that learns your house from the smallest action you'll actually take: an address, a nameplate photo, an inspection report. My 3D home-avatar prototypes drove a 60% lift in new-user engagement." },
    { key: "virdio", label: "VIRDIO", img: "media/d-virdio.png", gamma: 1.1, lines: ["NO $1,500", "BIKE.", "A CAMERA."], stat: "-50% HANDOFF TIME",
      href: "https://hridaew.com/virdio", media: { img: "media/virdio.webp" },
      body: "Product Designer, 2021–2022. Hardware-free AR fitness: an ordinary camera reads your body and counts punches, squats and jumps, and AR objects double as hit boxes. Shipped on six platforms; my design tokens cut handoff time 50% across four." },
    { key: "obscura", label: "OBSCURA", img: "media/d-obscura.png", gamma: 0.9, lines: ["WAYNE WONG", "JAPAN 1946"], stat: "300+ PHOTOS · SOLD OUT",
      href: "https://hridaew.com/obscura", media: { img: "media/obscura.webp" },
      body: "Interaction design, prototyping, Unity. MOHAI, Seattle, 13 Sep 2025, sold out. 300+ never-seen photographs by Wayne Wong, a Signal Corps soldier in 1946 Japan; a visitor looks in VR while an audience watches through their eyes. Photograph on the board: Wayne Wong, 1946." },
    { key: "mc", label: "MEMORY CARE", img: "media/d-mc.png", gamma: 1.05, lines: ["PET IT.", "IT PURRS."], stat: "98% POSITIVE",
      href: "https://hridaew.com/memory-care", media: { img: "media/mc.webp" },
      body: "Interaction Designer with Maria Mortati Experience Design, 2020–2023. I hacked plush cats with pressure sensors and vibration motors so petting one makes it purr, and moved the haptics to a footrest so 100% of residents could reach them from their wheelchairs. 98% positive across 200+ sessions. Fast Company World Changing Ideas 2022 finalist · CABHI 2× award recipient · SCAN Foundation Innovation Award." },
  ];

  /* ── geometry ── */
  let C = 100, R = 46, pitch = 8, W = 0, H = 0, dpr = 1, wide = true;
  let cur = new Uint8Array(0), want = new Uint8Array(0);
  let animStart = new Float32Array(0), animKind = new Uint8Array(0); // 0 none, 1 flip, 2 pulse
  const active = new Set();
  let targets = [], face = null;

  function layout() {
    const w = canvas.clientWidth;
    wide = w >= 620;
    C = wide ? 180 : 72;
    pitch = w / C;
    R = wide ? 86 : 112;
    dpr = Math.min(2, devicePixelRatio || 1);
    W = Math.round(w); H = Math.round(R * pitch);
    canvas.style.height = H + "px";
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cur = new Uint8Array(C * R); want = new Uint8Array(C * R);
    animStart = new Float32Array(C * R); animKind = new Uint8Array(C * R); active.clear();
    if (wide) {
      const ty = Math.round(R * 0.6);
      targets = [0.13, 0.37, 0.61, 0.85].map((fx, i) => ({ i, x: Math.round(C * fx), y: ty, r: 12 }));
      face = { x: C - 24, y: 2, w: 21, h: 26 };
    } else {
      targets = [[0.25, 0.5], [0.75, 0.5], [0.25, 0.78], [0.75, 0.78]].map(([fx, fy], i) => ({ i, x: Math.round(C * fx), y: Math.round(R * fy), r: 9 }));
      face = { x: C - 19, y: 2, w: 17, h: 22 };
    }
    drawAll();
  }

  /* ── drawing discs ── */
  function cell(i) { return [(i % C) * pitch, Math.floor(i / C) * pitch]; }
  function disc(i, faceUp, squash, glint) {
    const [x, y] = cell(i);
    ctx.fillStyle = "#070707"; ctx.fillRect(x, y, pitch, pitch);
    const r = pitch * 0.43, cx = x + pitch / 2, cy = y + pitch / 2;
    ctx.fillStyle = faceUp ? "#F2EDE4" : "#181818";
    ctx.beginPath(); ctx.ellipse(cx, cy, r, Math.max(0.4, r * squash), 0, 0, Math.PI * 2); ctx.fill();
    if (glint) { ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fillRect(cx - r, cy - 0.5, r * 2, 1); }
    else if (!faceUp && pitch > 6) { ctx.fillStyle = "#222"; ctx.fillRect(cx - r, cy - 0.3, r * 2, 0.6); }
  }
  function drawAll() { for (let i = 0; i < C * R; i++) disc(i, cur[i], 1); }

  const FLIP = 90;
  function schedule(i, kind, delay) {
    animKind[i] = kind; animStart[i] = performance.now() + delay; active.add(i);
  }
  /** Show a bitmap: flip every disc that differs, ordered by `order` (ms per index). */
  function show(bits, orderFn) {
    want = bits;
    for (let i = 0; i < C * R; i++) {
      if (bits[i] !== cur[i] || (animKind[i] === 1 && active.has(i))) {
        if (reduce) { cur[i] = bits[i]; disc(i, cur[i], 1); continue; }
        schedule(i, 1, orderFn ? orderFn(i % C, Math.floor(i / C)) : 0);
      }
    }
    kick();
  }
  function shockwave(cx, cy, radius) {
    if (reduce) return;
    for (let y = Math.max(0, cy - radius); y < Math.min(R, cy + radius); y++)
      for (let x = Math.max(0, cx - radius); x < Math.min(C, cx + radius); x++) {
        const d = Math.hypot(x - cx, y - cy); if (d > radius) continue;
        const i = y * C + x; if (animKind[i] === 1 && active.has(i)) continue;
        schedule(i, 2, d * 10);
      }
    clacks(Math.min(40, radius * 3));
    kick();
  }
  let rafOn = false;
  function kick() { if (!rafOn) { rafOn = true; requestAnimationFrame(tick); } }
  function tick(now) {
    for (const i of active) {
      const t = now - animStart[i];
      if (t < 0) continue;
      const kind = animKind[i], dur = kind === 1 ? FLIP : FLIP * 2;
      if (t >= dur) {
        if (kind === 1) cur[i] = want[i];
        animKind[i] = 0; active.delete(i); disc(i, cur[i], 1); continue;
      }
      const a = (t / FLIP) * Math.PI; // 0..π (flip) or 0..2π (pulse)
      let up;
      if (kind === 1) up = a < Math.PI / 2 ? cur[i] : want[i];
      else up = (a > Math.PI / 2 && a < Math.PI * 1.5) ? 1 - cur[i] : cur[i];
      disc(i, up, Math.abs(Math.cos(a)), Math.abs(Math.cos(a)) < 0.35);
    }
    if (active.size) requestAnimationFrame(tick); else rafOn = false;
  }

  /* ── composing bitmaps on a disc-resolution canvas ── */
  const pc = document.createElement("canvas"), p = pc.getContext("2d", { willReadFrequently: true });
  function begin() { pc.width = C; pc.height = R; p.imageSmoothingEnabled = false; p.fillStyle = "#000"; p.fillRect(0, 0, C, R); p.fillStyle = "#fff"; p.strokeStyle = "#fff"; }
  function text(str, x, y, h, align = "left") {
    p.font = `${h}px "Jersey 10", monospace`; p.textBaseline = "top"; p.textAlign = align; p.fillText(str, x, y);
  }
  function fitText(str, x, y, maxW, h) { let s = h; p.font = `${s}px "Jersey 10", monospace`; while (p.measureText(str).width > maxW && s > 6) { s--; p.font = `${s}px "Jersey 10", monospace`; } text(str, x, y, s); return s; }
  function ring(x, y, r) { p.lineWidth = 1; p.beginPath(); p.arc(x + 0.5, y + 0.5, r, 0, Math.PI * 2); p.stroke(); }
  function dot(x, y, r) { p.beginPath(); p.arc(x + 0.5, y + 0.5, r, 0, Math.PI * 2); p.fill(); }
  function end(extra) {
    const d = p.getImageData(0, 0, C, R).data, bits = new Uint8Array(C * R);
    for (let i = 0; i < C * R; i++) bits[i] = d[i * 4] > 140 ? 1 : 0;
    if (extra) extra(bits);
    return bits;
  }
  const dithered = {};
  function loadImg(src) { return new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }
  function dither(im, w, h, gamma) {
    const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#fff"; g.fillRect(0, 0, w, h);
    const s = Math.max(w / im.width, h / im.height), dw = im.width * s, dh = im.height * s;
    g.drawImage(im, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const d = g.getImageData(0, 0, w, h).data, L = new Float32Array(w * h);
    for (let i = 0; i < w * h; i++) L[i] = Math.pow((d[i * 4] * .3 + d[i * 4 + 1] * .59 + d[i * 4 + 2] * .11) / 255, gamma);
    const out = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x, o = L[i] > 0.5 ? 1 : 0, e = (L[i] - o) / 8; out[i] = o;
      [[1, 0], [2, 0], [-1, 1], [0, 1], [1, 1], [0, 2]].forEach(([dx, dy]) => { const xx = x + dx, yy = y + dy; if (xx >= 0 && xx < w && yy < h) L[yy * w + xx] += e; });
    }
    return { w, h, out };
  }
  function blit(dd, x0, y0, bits) { for (let y = 0; y < dd.h; y++) for (let x = 0; x < dd.w; x++) { const X = x0 + x, Y = y0 + y; if (X >= 0 && X < C && Y >= 0 && Y < R) bits[Y * C + X] = dd.out[y * dd.w + x]; } }

  const hits = new Set(), holes = [];
  let marquee = 0, freed = false;
  const MARQ = "PRODUCT DESIGNER · FOUNDING PRODUCT DESIGNER AT DOMIS · SAN FRANCISCO · I LEARN BY MAKING · ";
  function homeBits() {
    begin();
    if (wide) {
      fitText("HRIDAE WALIA", 3, 2, C - face.w - 10, 26);
      fitText("INTERACTION + PRODUCT DESIGNER", 3, 30, C - face.w - 14, 13);
    } else {
      fitText("HRIDAE", 2, 2, C - face.w - 6, 22); fitText("WALIA", 2, 22, C - face.w - 6, 22);
      fitText("PRODUCT DESIGNER", 2, 44, C - 4, 13);
    }
    // net (diamond lattice) between the targets, unless freed
    if (!freed) {
      const top = targets[0].y - targets[0].r - 1, bot = (wide ? targets[0].y : targets[2].y) + targets[0].r;
      p.lineWidth = 1; p.globalAlpha = 1;
      for (let k = -R; k < C + R; k += 12) {
        p.beginPath(); p.moveTo(k, top); p.lineTo(k + (bot - top), bot); p.stroke();
        p.beginPath(); p.moveTo(k, bot); p.lineTo(k + (bot - top), top); p.stroke();
      }
      p.globalCompositeOperation = "destination-out";
      holes.forEach(([x, y]) => { p.beginPath(); p.arc(x, y, 6, 0, 7); p.fill(); });
      targets.forEach((t) => { p.beginPath(); p.arc(t.x + 0.5, t.y + 0.5, t.r + 2, 0, 7); p.fill(); });
      p.globalCompositeOperation = "source-over";
      // Baby J tangled between targets
      const cx = wide ? Math.round((targets[1].x + targets[2].x) / 2) : Math.round(C / 2), cy = wide ? targets[1].y - 2 : Math.round((targets[0].y + targets[2].y) / 2);
      p.beginPath(); p.ellipse(cx, cy, 6, 3, 0, 0, 7); p.fill(); p.fillRect(cx - 9, cy - 2, 3, 5); p.fillRect(cx + 1, cy - 6, 2, 3);
    }
    targets.forEach((t) => {
      ring(t.x, t.y, t.r); ring(t.x, t.y, t.r - 3);
      if (hits.has(t.i)) dot(t.x, t.y, t.r - 1); else dot(t.x, t.y, 1);
      const lines = PROJECTS[t.i].label === "MEMORY CARE" ? (wide ? ["MEMORY", "CARE"] : ["MEMORY"]) : [PROJECTS[t.i].label];
      lines.forEach((label, li) => { p.font = `12px "Jersey 10", monospace`; const lw = Math.min(C / (wide ? 4.3 : 2.3), p.measureText(label).width);
      p.fillStyle = "#000"; p.fillRect(Math.round(t.x - lw / 2) - 2, t.y + t.r + 2 + li * 11, lw + 4, 12); p.fillStyle = "#fff";
      fitText(label, Math.round(t.x - lw / 2), t.y + t.r + 3 + li * 11, C / (wide ? 4.3 : 2.3), 12); });
    });
    if (wide) { fitText("HIT ME", face.x - 1, face.y + face.h + 3, face.w + 2, 12); }
    return end((bits) => {
      const f = dithered.face; if (f) blit(f, face.x, face.y, bits);
    });
  }
  function projectBits(k) {
    const P = PROJECTS[k]; begin();
    const size = wide ? R - 4 : Math.min(C - 8, 56);
    const tx = wide ? size + 10 : 3, ty = wide ? 6 : size + 6;
    let y = ty;
    const lh = Math.min(wide ? 20 : 15, Math.floor((R - ty - 38) / P.lines.length));
    P.lines.forEach((l) => { fitText(l, tx, y, C - tx - 2, lh + 2); y += lh; });
    y += 4; const words = P.stat.split(" "); let line = "";
    words.forEach((w) => { const tryL = line ? line + " " + w : w; p.font = `14px "Jersey 10", monospace`; if (p.measureText(tryL).width > C - tx - 2 && line) { fitText(line, tx, y, C - tx - 2, 14); y += 13; line = w; } else line = tryL; });
    if (line) fitText(line, tx, y, C - tx - 2, 14);
    return end((bits) => { const dd = dithered[P.key]; if (dd) blit(dd, wide ? 2 : Math.round((C - size) / 2), 2, bits); });
  }
  function messageBits(lines) {
    begin(); const h = wide ? 24 : 16; let y = Math.round(R / 2 - (lines.length * h) / 2);
    lines.forEach((l) => { p.font = `${h}px "Jersey 10", monospace`; const w = Math.min(C - 4, p.measureText(l).width); fitText(l, Math.round((C - w) / 2), y, C - 4, h); y += h; });
    return end();
  }
  function kidBits() {
    begin(); const kx = wide ? 56 : 3, ky = wide ? 10 : 58; text("M.HCI+D UW 2024", kx, ky, 16); text("BFA CCA 2020", kx, ky + 17, 16); text("I HAVE A CAT", kx, ky + 34, 16);
    return end((bits) => { const d = dithered.kid; if (d) blit(d, 2, 2, bits); });
  }

  /* ── screens + timing ── */
  let screen = "home", holdT = null;
  const wipe = (x) => x * 6;
  function goHome() { clearTimeout(holdT); screen = "home"; show(homeBits(), (x) => wipe(x)); }
  function hold(ms) { clearTimeout(holdT); holdT = setTimeout(goHome, ms); }
  

  /* ── throwing ── */
  const orca = $("#orca"), floor = $("#floor"), reticle = $("#reticle"), bandline = $("#bandline");
  const flyer = $("#flyer"), shadowEl = $("#shadow");
  let drag = null, throws = 0, hitCount = 0, near = 0;
  const MAXPULL = 160;
  function boardPoint(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return { x: (clientX - r.left) / pitch, y: (clientY - r.top) / pitch, inside: clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom };
  }
  function predict(pull) {
    const o = orca.getBoundingClientRect(), b = canvas.getBoundingClientRect();
    const pow = Math.min(1, Math.hypot(pull.x, pull.y) / MAXPULL);
    const x = o.left + o.width / 2 + pull.x * 2.4;
    const y = b.bottom - Math.max(0, pull.y) / MAXPULL * b.height * 1.15;
    return { x, y, pow };
  }
  orca.addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    e.preventDefault(); orca.setPointerCapture(e.pointerId);
    drag = { sx: e.clientX, sy: e.clientY, pull: { x: 0, y: 0 } };
    if (screen !== "home" && screen !== "finale") goHome();
  });
  orca.addEventListener("pointermove", (e) => {
    if (!drag) return;
    let dx = drag.sx - e.clientX, dy = drag.sy - e.clientY; // pulling down/back gives positive dy
    dy = -dy; const len = Math.hypot(dx, dy); if (len > MAXPULL) { dx *= MAXPULL / len; dy *= MAXPULL / len; }
    drag.pull = { x: dx, y: dy };
    orca.style.transform = `translate(${-dx * 0.5}px, ${dy * 0.5}px) rotate(${-dx * 0.08}deg)`;
    const fr = floor.getBoundingClientRect(), o = orca.getBoundingClientRect();
    bandline.setAttribute("x1", fr.width / 2); bandline.setAttribute("y1", 64);
    bandline.setAttribute("x2", o.left - fr.left + o.width / 2); bandline.setAttribute("y2", o.top - fr.top + o.height / 2);
    if (dy > 14) {
      const pr = predict(drag.pull), fr2 = frame.getBoundingClientRect();
      reticle.style.left = pr.x - fr2.left + "px"; reticle.style.top = pr.y - fr2.top + "px"; reticle.classList.add("on");
    } else reticle.classList.remove("on");
  });
  const release = () => {
    if (!drag) return;
    const pull = drag.pull; drag = null;
    orca.style.transform = ""; reticle.classList.remove("on"); bandline.setAttribute("x2", bandline.getAttribute("x1")); bandline.setAttribute("y2", bandline.getAttribute("y1"));
    if (pull.y < 14) return;
    const pr = predict(pull);
    fly(pr.x, pr.y, null);
  };
  orca.addEventListener("pointerup", release); orca.addEventListener("pointercancel", release);

  function throwAt(i) {
    const b = canvas.getBoundingClientRect();
    if (i === 4) fly(b.left + (face.x + face.w / 2) * pitch, b.top + (face.y + face.h / 2) * pitch, 4);
    else { const t = targets[i]; fly(b.left + (t.x + 0.5) * pitch, b.top + (t.y + 0.5) * pitch, i); }
  }
  document.querySelectorAll("[data-t]").forEach((b) => b.addEventListener("click", () => throwAt(+b.dataset.t)));

  let flying = false, pending = null;
  function fly(tx, ty, forced) {
    if (flying) { pending = [tx, ty, forced]; return; }
    flying = true; throws++;
    if (screen !== "home") { clearTimeout(holdT); screen = "home"; show(homeBits()); }
    const o = orca.getBoundingClientRect(), sx = o.left + o.width / 2, sy = o.top + o.height / 2;
    orca.style.visibility = "hidden";
    if (reduce) { land(tx, ty, forced); return; }
    flyer.style.display = "block"; shadowEl.style.display = "block";
    const t0 = performance.now(), dur = 520, peak = Math.min(sy, ty) - 120, spin = (tx - sx) * 0.6;
    const step = (now) => {
      const t = Math.min(1, (now - t0) / dur), e = t;
      const x = sx + (tx - sx) * e;
      const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * peak + e * e * ty;
      const sc = 1 - 0.68 * e;
      flyer.style.transform = `translate(${x - 66}px, ${y - 41}px) scale(${sc}) rotate(${spin * e}deg)`;
      const shy = sy + (ty - sy) * e; // shadow travels the floor then climbs the board
      shadowEl.style.transform = `translate(${x}px, ${shy + 10 * (1 - e)}px) scale(${0.5 + 0.5 * (1 - e) + 0.15}, 1)`;
      shadowEl.style.filter = `blur(${14 * (1 - e)}px)`; shadowEl.style.opacity = (0.15 + 0.3 * e).toFixed(2);
      if (t < 1) requestAnimationFrame(step);
      else {
        flyer.animate([{ transform: flyer.style.transform + " scale(1.25,0.8)" }, { transform: flyer.style.transform }], { duration: 90 });
        setTimeout(() => { flyer.style.display = "none"; shadowEl.style.display = "none"; }, 110);
        land(tx, ty, forced);
      }
    };
    requestAnimationFrame(step);
  }
  function pileUp() {
    const pile = $("#pile"); if (pile.children.length >= 6) pile.firstElementChild.remove();
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 132 82"); s.innerHTML = '<use href="#orca-art"/>';
    s.style.transform = `rotate(${(Math.random() * 40 - 20).toFixed(0)}deg)`; pile.appendChild(s);
  }
  function land(tx, ty, forced) {
    setTimeout(() => { orca.style.visibility = ""; flying = false; if (pending && pending[2] != null) { const p = pending; pending = null; throwAt(p[2]); } else pending = null; }, reduce ? 50 : 260);
    const bp = boardPoint(tx, ty);
    let result = "miss", which = -1;
    if (forced === 4) { result = "face"; }
    else if (forced != null) { result = "hit"; which = forced; }
    else if (bp.inside) {
      const fx = face.x + face.w / 2, fy = face.y + face.h / 2;
      if (Math.abs(bp.x - fx) < face.w * 0.7 && Math.abs(bp.y - fy) < face.h * 0.7) result = "face";
      let best = null;
      targets.forEach((t) => { const d = Math.hypot(bp.x - t.x, bp.y - t.y) / t.r; if (!best || d < best.d) best = { t, d }; });
      if (result !== "face" && best) { if (best.d <= 1.25) { result = "hit"; which = best.t.i; } else if (best.d <= 1.7) result = "near"; }
    }
    thump(result === "hit" && which === 3);
    const cx = Math.round(Math.max(0, Math.min(C - 1, bp.x))), cy = Math.round(Math.max(0, Math.min(R - 1, bp.y)));
    if (bp.inside || forced != null) shockwave(cx, cy, which === 3 ? 9 : 18);
    count();
    if (result === "hit") onHit(which, cx, cy);
    else if (result === "face") { screen = "kid"; openPanel(ABOUT); say("Hit me. A photo of me as a kid, and my education."); setTimeout(() => { show(kidBits(), (x) => wipe(x)); hold(6000); }, 260); }
    else if (result === "near") { near++; screen = "msg"; say("Near miss. One more."); setTimeout(() => { show(messageBits(["NEAR MISS.", "ONE MORE."])); hold(1000); }, 200); }
    else { screen = "msg"; say("Miss. Did you step out of frame?"); show(messageBits(wide ? ["DID YOU STEP", "OUT OF FRAME?"] : ["DID YOU", "STEP OUT", "OF FRAME?"])); hold(1400); }
  }
  function onHit(k, cx, cy) {
    const first = !hits.has(k);
    hits.add(k); hitCount++; count();
    holes.push([cx, cy]);
    document.querySelector(`[data-t="${k}"]`).setAttribute("data-done", "");
    card(k);
    screen = "proj"; say(`Hit ${PROJECTS[k].label}. ${PROJECTS[k].lines.join(" ")} ${PROJECTS[k].stat}.`);
    setTimeout(() => { show(projectBits(k), (x) => wipe(x)); hold(6000); }, reduce ? 0 : 260);
    if (first && hits.size === 4) setTimeout(finale, reduce ? 1200 : 6600);
  }
  function finale() {
    clearTimeout(holdT); freed = true; screen = "finale";
    say("The net snaps. Baby J is free.");
    show(homeBits(), (x, y) => (y - (targets[0].y - 10)) * 25 + Math.abs(x - C / 2) * 2);
    let k = 0; const steps = reduce ? 1 : 26;
    const swim = () => {
      begin(); const x = Math.round((k / steps) * (C + 12)) - 6, y = Math.round(R * 0.62 + Math.sin(k / 3) * 3);
      p.beginPath(); p.ellipse(x, y, 7, 3.5, 0, 0, 7); p.fill(); p.fillRect(x - 10, y - 3, 3, 6); p.fillRect(x + 1, y - 7, 2, 4);
      fitText("BABY J IS FREE", 3, 3, C - 6, wide ? 24 : 16);
      show(end());
      if (++k <= steps) setTimeout(swim, 70);
      else setTimeout(() => { show(messageBits(wide ? ["BABY J IS FREE", "SAY HI:", "HRIDAEW@GMAIL.COM"] : ["BABY J", "IS FREE", "SAY HI:", "HRIDAEW@", "GMAIL.COM"]), (x) => wipe(x)); }, 400);
    };
    setTimeout(swim, reduce ? 0 : 2500);
    const acc = throws ? Math.round((hitCount / throws) * 100) : 0;
    typeLog(`PLAYTEST LOG · your browser\nThrows ${throws} · Hits ${hitCount} · Near misses ${near}\nAccuracy ${acc}% · Tutorials needed 0\nSame as the real booth: the throw won.`);
  }
  function typeLog(s) { openPanel({ kicker: "Finale", title: "Baby J is free", meta: "Every project hit", media: null, html: `<p class="log" id="log"></p><div class="links"><a href="https://hridaew.com/waffling/orca" target="_blank" rel="noopener">The real Saving Baby J ↗</a></div>` }); const el = $("#log"); if (reduce) { el.textContent = s; return; } let n = 0; const t = () => { el.textContent = s.slice(0, ++n); if (n < s.length) setTimeout(t, 28); }; t(); }
  function count() { $("#count").textContent = `${throws} throw${throws === 1 ? "" : "s"} · ${hitCount} hit${hitCount === 1 ? "" : "s"}`; }
  function say(s) { $("#live").textContent = s; canvas.setAttribute("aria-label", "Flip-dot board: " + s); }

  const ABOUT = {
    kicker: "About", title: "Hridae Walia", meta: "Interaction & product designer · San Francisco",
    media: { img: "media/kid.webp", portrait: true },
    html: `<p>I design for interaction models that barely exist yet, and I learn by making: on the canvas, in code, and in the physical world. Founding Product Designer at Domis.</p>
      <p style="color:var(--dim);font-size:14px">M.HCI+D, University of Washington, 2024 · BFA Interaction Design, California College of the Arts, 2020. That's me as a kid, on the board.</p>
      <p class="kicker" style="margin-top:22px">Side builds</p><ul>
      <li><a href="https://hridaew.com/waffling/orca" target="_blank" rel="noopener">Saving Baby J ↗</a><span>The real version of this board: throw plush orcas to free a calf.</span></li>
      <li><a href="https://hridaew.com/waffling/savor" target="_blank" rel="noopener">Savor ↗</a><span>Phone video to 3D Gaussian splat, on-device.</span></li>
      <li><a href="https://hridaew.com/waffling/recorder" target="_blank" rel="noopener">Recorder-Proto ↗</a><span>Scrub a voice memo like a turntable.</span></li>
      <li><a href="https://hridaew.com/butter-chicken" target="_blank" rel="noopener">Butter Chicken ↗</a><span>Taste scales linearly with butter.</span></li></ul>`,
  };
  const META = ["Founding Product Designer · 2024–now", "Product Designer · 2021–2022", "Interaction design, Unity · MOHAI, 2025", "Interaction Designer · 2020–2023"];
  const TITLES = ["Domis", "Virdio", "OBSCURA", "Memory Care"];
  function openPanel(d) {
    $("#p-kicker").textContent = d.kicker; $("#p-title").textContent = d.title; $("#p-meta").textContent = d.meta;
    const m = $("#p-media"); m.className = "media" + (d.media && d.media.portrait ? " portrait" : ""); m.innerHTML = ""; m.hidden = !d.media;
    if (d.media && d.media.video) { const v = document.createElement("video"); v.src = d.media.video; v.poster = d.media.poster; v.muted = true; v.loop = true; v.playsInline = true; m.appendChild(v); if (!reduce) v.play().catch(() => {}); }
    else if (d.media) { const im = document.createElement("img"); im.src = d.media.img; im.alt = d.title; m.appendChild(im); }
    $("#p-body").innerHTML = d.html;
    $("#panel").classList.add("open");
  }
  $("#p-close").addEventListener("click", () => $("#panel").classList.remove("open"));
  function card(k) {
    const P = PROJECTS[k];
    openPanel({ kicker: `Hit ${hits.size} of 4`, title: TITLES[k], meta: META[k], media: P.media,
      html: `<p>${P.body.replace(/^[^.]*\.\s*/, "")}</p><div class="links"><a href="${P.href}" target="_blank" rel="noopener">Read the case study ↗</a></div>` });
  }
  addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.matches && e.target.matches("input, textarea")) return;
    const k = { "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 }[e.key];
    if (k !== undefined) { throwAt(k); return; }
    if (e.key === "Escape") { $("#panel").classList.remove("open"); goHome(); }
    if (e.key.toLowerCase() === "s" && document.activeElement === document.body) toggleSound();
  });

  /* ── sound ── */
  let actx = null, soundOn = false;
  function toggleSound() {
    soundOn = !soundOn;
    if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
    const b = $("#sound"); b.textContent = "sound " + (soundOn ? "on" : "off"); b.setAttribute("aria-pressed", soundOn);
  }
  $("#sound").addEventListener("click", toggleSound);
  function noise(t, gain) {
    const len = Math.floor(actx.sampleRate * 0.004), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = buf; f.type = "bandpass"; f.frequency.value = 2200 + Math.random() * 800; f.Q.value = 3; g.gain.value = gain;
    s.connect(f).connect(g).connect(actx.destination); s.start(t);
  }
  function clacks(n) { if (!soundOn || !actx) return; for (let i = 0; i < n; i++) noise(actx.currentTime + 0.06 + i * 0.012, 0.25); }
  function thump(soft) {
    if (!soundOn || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.setValueAtTime(soft ? 60 : 80, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(soft ? 0.25 : 0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.15);
  }

  $("#copy").addEventListener("click", async (e) => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText("hridaew@gmail.com"); b.textContent = "copied"; }
    catch (err) { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "selected"; }
    setTimeout(() => (b.textContent = "copy"), 1600);
  });

  /* ── boot ── */
  const face_w = () => face.w, face_h = () => face.h;
  async function boot() {
    layout();
    try { await document.fonts.load('12px "Jersey 10"'); } catch (e) {}
    const [face, kid, ...ims] = await Promise.all(["media/d-face.png", "media/d-kid.png", ...PROJECTS.map((p) => p.img)].map(loadImg));
    if (face) dithered.face = dither(face, face_w(), face_h(), 0.9);
    if (kid) dithered.kid = dither(kid, wide ? 48 : 40, wide ? 60 : 50, 0.95);
    const size = wide ? R - 4 : Math.min(C - 8, 56);
    ims.forEach((im, i) => { if (im) dithered[PROJECTS[i].key] = dither(im, size, size, PROJECTS[i].gamma); });
    // first frame: no animation, just the board
    const b = homeBits(); cur = b.slice(); want = b; drawAll();
    say("HRIDAE WALIA, product designer. Four targets: Domis, Virdio, OBSCURA, Memory Care.");
    let rt = null;
    new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(async () => {
      const wasWide = wide; layout();
      if (wasWide !== wide) { if (face) dithered.face = dither(face, face_w(), face_h(), 0.9); if (kid) dithered.kid = dither(kid, wide ? 48 : 40, wide ? 60 : 50, 0.95); const s2 = wide ? R - 4 : Math.min(C - 8, 56); ims.forEach((im, i) => { if (im) dithered[PROJECTS[i].key] = dither(im, s2, s2, PROJECTS[i].gamma); }); }
      const nb = homeBits(); cur = nb.slice(); want = nb; screen = "home"; drawAll();
    }, 150); }).observe(frame);
  }
  boot();
})();
</script>
