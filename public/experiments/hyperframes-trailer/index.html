<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hridae W. — Portfolio Trailer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0c0c0e;
        color: #f3f3f5;
        font-family: "Geist", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
      }
      .clip {
        position: absolute;
      }

      .wash {
        inset: -10%;
        background:
          radial-gradient(1200px 900px at 30% 20%, rgba(120, 110, 220, 0.22), transparent 60%),
          radial-gradient(1000px 800px at 75% 80%, rgba(70, 130, 200, 0.18), transparent 65%),
          radial-gradient(800px 600px at 50% 50%, rgba(255, 255, 255, 0.04), transparent 70%);
        filter: blur(8px);
        will-change: transform, opacity;
      }

      /* Scene 1 — Intro */
      .intro-wordmark,
      .intro-subline {
        left: 0;
        right: 0;
        text-align: center;
      }
      .intro-wordmark {
        top: 380px;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: 220px;
        letter-spacing: -0.04em;
        line-height: 0.95;
        color: #ffffff;
      }
      .intro-subline {
        top: 650px;
        font-size: 34px;
        font-weight: 500;
        color: rgba(243, 243, 245, 0.6);
        letter-spacing: -0.01em;
      }

      /* Case-study card (Scenes 2 & 3) */
      .case-video {
        left: 240px;
        top: 130px;
        width: 1440px;
        height: 820px;
        object-fit: cover;
        border-radius: 32px;
        background: #000;
      }
      .case-frame {
        left: 240px;
        top: 130px;
        width: 1440px;
        height: 820px;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
          0 60px 120px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(12, 12, 14, 0.05) 0%,
          rgba(12, 12, 14, 0.35) 70%,
          rgba(12, 12, 14, 0.7) 100%
        );
      }

      .caption {
        left: 288px;
        bottom: 180px;
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 18px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(16, 16, 20, 0.55);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        font-family: "Geist", system-ui, sans-serif;
        font-size: 28px;
        font-weight: 500;
        color: #f3f3f5;
        letter-spacing: -0.01em;
      }
      .caption .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #7ae0b4;
        box-shadow: 0 0 12px rgba(122, 224, 180, 0.8);
      }
      .caption .label-muted {
        color: rgba(243, 243, 245, 0.55);
      }

      /* Scene 4 — Outro */
      .outro-domain,
      .outro-path,
      .outro-byline {
        left: 0;
        right: 0;
        text-align: center;
      }
      .outro-domain {
        top: 380px;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: 180px;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #ffffff;
      }
      .outro-path {
        top: 600px;
        font-family: "Geist", system-ui, sans-serif;
        font-size: 36px;
        font-weight: 500;
        color: rgba(243, 243, 245, 0.55);
        letter-spacing: -0.01em;
      }
      .outro-byline {
        top: 820px;
        font-size: 22px;
        font-weight: 500;
        color: rgba(243, 243, 245, 0.35);
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="14"
      data-width="1920"
      data-height="1080"
    >
      <!-- Ambient wash — whole trailer -->
      <div
        id="wash"
        class="clip wash"
        data-start="0"
        data-duration="14"
        data-track-index="0"
      ></div>

      <!-- Scene 1 — Intro (0 → 3s) -->
      <div
        id="intro-wordmark"
        class="clip intro-wordmark"
        data-start="0"
        data-duration="3"
        data-track-index="1"
      >
        Hridae W.
      </div>
      <div
        id="intro-subline"
        class="clip intro-subline"
        data-start="0"
        data-duration="3"
        data-track-index="2"
      >
        Product &amp; interaction design
      </div>

      <!-- Scene 2 — Virdio (3 → 7s) -->
      <video
        id="virdio-video"
        class="clip case-video"
        data-start="3"
        data-duration="4"
        data-track-index="1"
        src="/assets/home/virdio-hero-crop.mp4"
        muted
        playsinline
        preload="auto"
      ></video>
      <div
        id="virdio-frame"
        class="clip case-frame"
        data-start="3"
        data-duration="4"
        data-track-index="2"
      ></div>
      <div
        id="virdio-caption"
        class="clip caption"
        data-start="3"
        data-duration="4"
        data-track-index="3"
      >
        <span class="dot"></span>
        <span><strong>Virdio</strong> <span class="label-muted">— AR fitness coach</span></span>
      </div>

      <!-- Scene 3 — Obscura (7 → 11s) -->
      <video
        id="obscura-video"
        class="clip case-video"
        data-start="7"
        data-duration="4"
        data-track-index="1"
        src="/assets/home/obscura-sbs-video.mp4"
        muted
        playsinline
        preload="auto"
      ></video>
      <div
        id="obscura-frame"
        class="clip case-frame"
        data-start="7"
        data-duration="4"
        data-track-index="2"
      ></div>
      <div
        id="obscura-caption"
        class="clip caption"
        data-start="7"
        data-duration="4"
        data-track-index="3"
      >
        <span class="dot"></span>
        <span><strong>Obscura</strong> <span class="label-muted">— VR museum exhibit</span></span>
      </div>

      <!-- Scene 4 — Outro (11 → 14s) -->
      <div
        id="outro-domain"
        class="clip outro-domain"
        data-start="11"
        data-duration="3"
        data-track-index="1"
      >
        hridaew.com
      </div>
      <div
        id="outro-path"
        class="clip outro-path"
        data-start="11"
        data-duration="3"
        data-track-index="2"
      >
        /experiments/hyperframes
      </div>
      <div
        id="outro-byline"
        class="clip outro-byline"
        data-start="11"
        data-duration="3"
        data-track-index="3"
      >
        Rendered live with HyperFrames
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // Every entry tween is fromTo so seeking (HyperFrames drives the
      // timeline via tl.time()) always has deterministic endpoints.

      // Ambient wash — fade in, drift through, ease out
      tl.fromTo(
        "#wash",
        { opacity: 0, xPercent: 0, yPercent: 0, scale: 1 },
        { opacity: 1, duration: 0.8 },
        0,
      )
        .to(
          "#wash",
          { xPercent: -2, yPercent: -3, scale: 1.04, duration: 14, ease: "none" },
          0,
        )
        .to("#wash", { opacity: 0.6, duration: 1 }, 13);

      // Scene 1 — Intro
      tl.fromTo(
        "#intro-wordmark",
        { opacity: 0, y: 40, filter: "blur(24px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.2 },
        0.1,
      )
        .fromTo(
          "#intro-subline",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.8 },
          0.7,
        )
        .to(
          ["#intro-wordmark", "#intro-subline"],
          { opacity: 0, y: -24, duration: 0.6, ease: "power2.in" },
          2.4,
        );

      // Scene 2 — Virdio
      tl.fromTo(
        ["#virdio-video", "#virdio-frame"],
        {
          opacity: 0,
          scale: 0.94,
          y: 28,
          filter: "blur(10px)",
          transformOrigin: "50% 50%",
        },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 1.1 },
        3.05,
      )
        .to(
          ["#virdio-video", "#virdio-frame"],
          { scale: 1.02, duration: 3.4, ease: "none" },
          3.4,
        )
        .fromTo(
          "#virdio-caption",
          { opacity: 0, x: -48 },
          { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" },
          3.5,
        )
        .to(
          ["#virdio-video", "#virdio-frame", "#virdio-caption"],
          { opacity: 0, filter: "blur(12px)", duration: 0.5, ease: "power2.in" },
          6.5,
        );

      // Scene 3 — Obscura
      tl.fromTo(
        ["#obscura-video", "#obscura-frame"],
        {
          opacity: 0,
          scale: 1.06,
          filter: "blur(10px)",
          transformOrigin: "50% 50%",
        },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0 },
        7.0,
      )
        .to(
          ["#obscura-video", "#obscura-frame"],
          { y: -20, duration: 3.6, ease: "none" },
          7.2,
        )
        .fromTo(
          "#obscura-caption",
          { opacity: 0, x: -48 },
          { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" },
          7.5,
        )
        .to(
          ["#obscura-video", "#obscura-frame", "#obscura-caption"],
          { opacity: 0, y: -20, duration: 0.5, ease: "power2.in" },
          10.5,
        );

      // Scene 4 — Outro
      tl.fromTo(
        "#outro-domain",
        { opacity: 0, y: 32, filter: "blur(18px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 1.0 },
        11.05,
      )
        .fromTo(
          "#outro-path",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.7 },
          11.5,
        )
        .fromTo(
          "#outro-byline",
          { opacity: 0 },
          { opacity: 1, duration: 0.8 },
          12.2,
        );

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
